<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#331A5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tú Delivery">
<title>Caja de Entregas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone ledger — day summary up top, quick entry, then the day's list; tabs for fiados and week */
:root{
  --bg:#F3F1F7; --surface:#FFFFFF; --ink:#1E1630; --muted:#665E75; --line:#DCD7E5;
  --accent:#331A5B; --accent-ink:#FFFFFF; --road:#331A5B;
  --cash:#1E7A4C; --transfer:#2D5FA8; --due:#B4501A;
  --cash-bg:#E3F2E9; --transfer-bg:#E5ECF7; --due-bg:#F8E8DE;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1D1726; --ink:#ECE8F3; --muted:#A49CB3; --line:#2F2740;
  --accent:#B9A2E6; --accent-ink:#1A0F2E; --road:#2A1550;
  --cash:#5FCB8F; --transfer:#86AEEB; --due:#F0935A;
  --cash-bg:#17301F; --transfer-bg:#1A2638; --due-bg:#36221A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1D1726; --ink:#ECE8F3; --muted:#A49CB3; --line:#2F2740;
  --accent:#B9A2E6; --accent-ink:#1A0F2E; --road:#2A1550;
  --cash:#5FCB8F; --transfer:#86AEEB; --due:#F0935A;
  --cash-bg:#17301F; --transfer-bg:#1A2638; --due-bg:#36221A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--road)}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--road);color:#F3F6F2;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.brand{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:22px;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand .logo{width:46px;height:38px;border-radius:7px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.brand span{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand small{font-family:var(--body);font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:#C9BEDD;margin-top:3px}
.sync{font-size:12px;color:#C9BEDD}
nav.tabs{display:flex;gap:4px;max-width:640px;margin:12px auto 0}
nav.tabs button{flex:1;background:none;border:0;color:#C9BEDD;font:600 14px var(--body);padding:10px 4px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--due);color:#fff;font-size:11px;line-height:18px}
main{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.daylabel{text-align:center;min-width:0}
.daylabel b{display:block;font-family:var(--display);font-stretch:85%;font-size:20px;font-weight:700;text-transform:capitalize}
.daylabel span{font-size:12px;color:var(--muted)}
/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sum-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 16px 12px;flex-wrap:wrap}
.sum-head .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:38px;line-height:1}
.count{text-align:right}
.count .big{font-size:30px}
.split{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.split>div{padding:10px 12px;min-width:0}
.split>div+div{border-left:1px solid var(--line)}
.split .k{font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.split .v{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .n{font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.c-cash{color:var(--cash)} .c-transfer{color:var(--transfer)} .c-due{color:var(--due)}
.d-cash{background:var(--cash)} .d-transfer{background:var(--transfer)} .d-due{background:var(--due)}
.caixa{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--cash-bg);border-top:1px solid var(--line);flex-wrap:wrap}
.caixa .t{font-size:13px;min-width:0}
.caixa .t small{display:block;color:var(--muted);font-size:12px}
.caixa .v{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:22px;color:var(--cash)}
.linkbtn{background:none;border:0;color:var(--ink);font:600 13px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
/* entry */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.entry h2,.sec h2{margin:0;font-family:var(--display);font-stretch:80%;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.money{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg)}
.money:focus-within{border-color:var(--accent)}
.money span{font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted)}
.money input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--display);font-stretch:85%;font-weight:800;font-size:34px;outline:none;padding:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.method{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 6px;font:600 14px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.method svg{width:22px;height:22px}
.method[aria-pressed="true"].m-cash{border-color:var(--cash);background:var(--cash-bg);color:var(--cash)}
.method[aria-pressed="true"].m-transfer{border-color:var(--transfer);background:var(--transfer-bg);color:var(--transfer)}
.method[aria-pressed="true"].m-due{border-color:var(--due);background:var(--due-bg);color:var(--due)}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:15px var(--body);background:var(--bg);color:var(--ink);width:100%}
.field input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px;font:600 15px var(--body);cursor:pointer}
.danger{background:none;border:1px solid var(--due);color:var(--due);border-radius:12px;padding:13px;font:600 15px var(--body);cursor:pointer}
.danger.armed{background:var(--due);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--due);font-size:13px;margin:-6px 0 0}
/* list */
.sec{display:grid;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h span{font-size:13px;color:var(--muted)}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row .time{font-size:13px;color:var(--muted)}
.row .who{min-width:0}
.row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right}
.row .amt b{font-family:var(--display);font-stretch:85%;font-size:17px;font-weight:700;display:block}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.p-cash{background:var(--cash-bg);color:var(--cash)} .p-transfer{background:var(--transfer-bg);color:var(--transfer)} .p-due{background:var(--due-bg);color:var(--due)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
/* fiados */
.due-total{background:var(--due-bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.due-total .big{color:var(--due);font-size:32px}
.due-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.due-row:first-child{border-top:0}
.due-row .who{min-width:0}
.due-row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-row .who small{color:var(--muted);font-size:12px}
.due-row .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.due-row .r b{font-family:var(--display);font-stretch:85%;font-size:17px}
.small{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font:600 13px var(--body);cursor:pointer}
.small.cash{border-color:var(--cash);color:var(--cash)} .small.transfer{border-color:var(--transfer);color:var(--transfer)}
.group-h{padding:8px 14px;background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.group-h:first-child{border-top:0}
/* week */
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 0}
.wrow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer}
.wrow .d{font-size:13px;text-transform:capitalize}
.wrow .d small{display:block;color:var(--muted);font-size:11px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--bg);min-width:0}
.bar i{display:block;height:100%}
.wrow .t{text-align:right;font-family:var(--display);font-stretch:85%;font-weight:700;font-size:15px;min-width:86px}
.wrow .t small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.wk-tot{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:24px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:92%;overflow:auto}
.sheet h3{margin:0;font-family:var(--display);font-stretch:85%;font-size:20px}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.method small{font-size:11px;font-weight:500;opacity:.8}
.acerto{border-top:1px solid var(--line);background:var(--bg);padding:12px 16px;display:grid;gap:6px}
.ac-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ac-row,.ac-res{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ac-row span{font-size:14px;min-width:0}
.ac-row b{font-family:var(--display);font-stretch:85%;font-size:16px;white-space:nowrap}
.ac-res{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.ac-res span{font-weight:700;font-size:15px}
.ac-res b{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:24px;white-space:nowrap}
.ac-foot{font-size:12px;color:var(--muted)}
.drv-table{border-top:1px solid var(--line)}
.drv-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.drv-row:first-child{border-top:0}
.drv-row .who{min-width:0}.drv-row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drv-row small{color:var(--muted);font-size:12px;display:block}
.drv-row .r{text-align:right}.drv-row .r b{font-family:var(--display);font-stretch:85%;font-size:17px}
.sum-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted-r{text-align:right;color:var(--muted);font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;color:var(--ink);font:600 14px var(--body);padding:9px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sheet .money input{font-size:28px}
/* keep everything inside the phone width */
html{overflow-x:hidden}
body{max-width:100%;overflow-x:clip}
main,header.top,.summary,.entry,.list,.sheet{max-width:100%}
main>*,.entry>*,.sec>*,.field>*{min-width:0}
.methods,.split,.wk-tot,.seg{grid-template-columns:repeat(3,minmax(0,1fr))}
.wk-tot{grid-template-columns:repeat(2,minmax(0,1fr))}
.method,.chip,.tile,.split div,.ac-row span,.ac-res span{min-width:0}
.method{text-align:center;overflow-wrap:anywhere;padding:10px 4px;font-size:13px}
.method small{font-size:10px;line-height:1.2}
.ac-row b,.ac-res b{white-space:nowrap;text-align:right;flex:none}
.ac-row span,.ac-res span{flex:1;min-width:0}
.ac-res b{font-size:22px}
.big{font-size:32px}
.count .big{font-size:26px}
.split>div{padding:10px 8px}
.split .v{font-size:15px}
.wrow{grid-template-columns:60px minmax(0,1fr) auto}
.wrow .t{min-width:0}
.row{grid-template-columns:40px minmax(0,1fr) auto}
.tile .v{font-size:20px;overflow-wrap:anywhere}
.brand{font-size:19px;min-width:0}
.sync{white-space:nowrap}
@media (max-width:360px){.big{font-size:28px}.split .v{font-size:13px}.money input{font-size:28px}}
.chip.other{border-style:dashed;border-color:var(--muted)}
.money input::placeholder{font-size:20px;font-weight:600;color:var(--muted)}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.who-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.rk-head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rk-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.rk-row:first-child{border-top:0}
.rk-row.me{background:var(--transfer-bg)}
.rk-pos{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:18px;color:var(--muted)}
.rk-pos.top{color:var(--accent)}
.rk-main{min-width:0;display:grid;gap:6px}
.rk-name{display:flex;align-items:center;gap:6px;min-width:0}
.rk-name b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-bar{display:block;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rk-n{text-align:right;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:22px;line-height:1}
.rk-n small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
nav.tabs button{padding-left:2px;padding-right:2px;font-size:13px}
.perm-warn{display:grid;gap:4px;background:var(--due-bg);border:1px solid var(--due);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.perm-warn b{color:var(--due)}
.sugs{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-top:6px;min-width:0}
.sug>*{min-width:0}
.sug span{flex:none}
/* iPhone zooms into any field under 16px: keep every field at 16px or more */
input,textarea,select,.field input,.pct-in input{font-size:16px!important}
.money input{font-size:30px!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input{touch-action:manipulation}
.entry,.summary,.list,.sec,.field,.sugs,.drv-row,.pend,.pend-h,.ac-pay,.pay-line{max-width:100%;min-width:0}
.pend-days,.pay-line,.ac-pay{overflow-wrap:anywhere}
.sug{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font:14px var(--body);cursor:pointer;text-align:left;min-width:0}
.sug b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sug span{font-size:12px;color:var(--muted);white-space:nowrap}
.ac-pay{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.pay-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.paid{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--cash-bg);color:var(--cash)}
.paid.warn{background:var(--due-bg);color:var(--due)}
.unpaid{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--due-bg);color:var(--due)}
.small.pay{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.small-link{font-size:12px;padding:0}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pend{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.pend:first-child{border-top:0}
.pend-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pend-h .who{min-width:0}.pend-h .who b{display:block}.pend-h small{color:var(--muted);font-size:12px}
.pend-h .r{display:grid;text-align:right;font-family:var(--display);font-stretch:85%;font-weight:700;font-size:16px}
.pend-days{display:flex;flex-wrap:wrap;gap:6px}
.pday{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.pend .small.pay{justify-self:start}
.empty.ok{border-style:solid;color:var(--cash)}
.pct-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.pct-row label{font-size:15px;min-width:0;overflow-wrap:anywhere}
.pct-in{display:flex;align-items:center;gap:6px;flex:none}
.pct-in input{width:64px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:600 16px var(--body);background:var(--bg);color:var(--ink);text-align:right}
.pct-in span{color:var(--muted);font-weight:600}
.g-row{display:flex;gap:8px;align-items:stretch}
.g-row .money{flex:1;min-width:0}
.small-money input{font-size:24px!important}
.small-money span{font-size:20px}
.g-add{flex:none;padding:0 18px;font-size:16px}
.g-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.g-item:first-child{border-top:0}
.g-item .who b{display:block}.g-item small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.g-item .r{display:grid;justify-items:end;gap:2px}
.g-item .r b{font-family:var(--display);font-stretch:85%;font-size:16px}
.g-total{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);font-weight:600}
.g-total b{font-family:var(--display);font-stretch:85%;font-size:17px;color:var(--due)}
.ac-net{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.ac-net b{font-family:var(--display);font-stretch:85%;font-size:17px;margin-left:4px}
.rk-bar i.gbar{background:var(--due)}
.prizes{display:grid;gap:10px}
.prize{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;border-left:4px solid var(--accent)}
.prize-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.prize-h b{font-family:var(--display);font-stretch:85%;font-size:18px;color:var(--accent)}
.prize-lead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px}
.prize-lead b{font-family:var(--display);font-stretch:85%;font-size:20px}
.prize-lead span{color:var(--muted)}
.prize-me{font-size:13px;font-weight:600;color:var(--transfer)}
.prize-prev{font-size:12px;color:var(--muted)}
/* app chrome: bottom tab bar, floating add button, compact header */
header.top{padding-block:12px 12px;transition:padding .2s}
.brand .logo{transition:width .2s,height .2s}
body.compact header.top{padding-block:8px 8px}
body.compact .brand .logo{width:34px;height:28px}
body.compact .brand small{display:none}
body.compact .brand{font-size:17px}
main{padding-block:16px calc(150px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;max-width:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;
  background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:600 11px var(--body);padding:6px 2px;border:0;border-radius:10px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:transparent;background:color-mix(in srgb,var(--accent) 10%,transparent)}
nav.tabs .badge{position:absolute;top:2px;right:22%}
.fab{position:fixed;z-index:16;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px 14px 16px;
  font-family:var(--display);font-stretch:85%;font-weight:800;font-size:17px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 6px 18px rgba(30,15,60,.35)}
.fab svg{width:22px;height:22px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;cursor:pointer;flex:none}
.sheet{gap:12px}
.entry-sheet .primary{position:sticky;bottom:0}
.add-g{border-color:var(--due);color:var(--due);background:var(--surface)}
.empresa{border-top:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface));padding:12px 16px;display:grid;gap:6px}
.empresa .ac-h{color:var(--accent)}
.add-e{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.emp-sec .sec-h h2{color:var(--accent)}
.hold{font-size:10.5px;color:var(--muted);line-height:1.2;margin-top:1px}
.cobrar{background:var(--transfer-bg);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.cobrar>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cobrar span{font-weight:600}
.cobrar b{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:24px;color:var(--transfer)}
.cobrar small{color:var(--muted);font-size:12px}
.cobrar .linkbtn{justify-self:start}
.camino-sec .sec-h h2{color:var(--transfer)}
.row.camino{background:var(--transfer-bg)}
.row .amt small{display:block;font-size:11px;color:var(--muted)}
.prod-note{border-top:1px solid var(--line);padding:10px 16px;font-size:13px;color:var(--muted);background:var(--bg)}
.danger.armed{background:var(--due);color:#fff}
.anotar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--transfer-bg);color:var(--ink);border:1px dashed var(--transfer);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit}
.anotar svg{width:26px;height:26px;color:var(--transfer);flex:none}
.anotar b{display:block;font-size:15px;color:var(--transfer)}
.anotar small{font-size:12px;color:var(--muted)}
.cam-row{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--transfer-bg)}
.cam-row:first-child{border-top:0}
.cam-info{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.cam-info .who{min-width:0}.cam-info .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam-info small{color:var(--muted);font-size:12px;display:block;overflow-wrap:anywhere}
.cam-info .amt{text-align:right}.cam-info .amt b{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:22px;color:var(--transfer)}
.cam-act{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fin{background:var(--cash);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:700 15px var(--body);cursor:pointer}
.methods{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.method[aria-pressed="true"].m-fijo{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.p-fijo{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.fijos{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px}
.fijo-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fijo-row .who{min-width:0}.fijo-row .who b{display:block}.fijo-row small{color:var(--muted);font-size:12px}
.team-btn{border-style:dashed!important;color:var(--muted)!important}
.team-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.team-row:first-child{border-top:0}
.team-row .who{min-width:0}.team-row .who b{display:block}.team-row small{color:var(--muted);font-size:12px}
.small.baja{border-color:var(--due);color:var(--due)}
.small.baja.armed{background:var(--due);color:#fff}
.emp-hint{margin:-6px 0 0;font-size:12px;color:var(--muted)}
.sol{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.sol-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sol-h .who{min-width:0}.sol-h .who b{display:block}.sol-h small{color:var(--muted);font-size:12px}
.sol-d{margin:0;font-size:14px;overflow-wrap:anywhere}
.sol-r{margin:0;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.sol-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small.ok{border-color:var(--cash);color:var(--cash)}
.p-muted{background:var(--bg);color:var(--muted)}
.sheet textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px var(--body);background:var(--bg);color:var(--ink);resize:vertical}
nav.tabs button{font-size:10.5px}
.toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;white-space:nowrap}
.note{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

function subscribeUser(u){
  if(subs.has(u))return;
  const from=addDays(today(),-WINDOW);
  subs.set(u,colFor(u).where("dia",">=",from).limit(1000).onSnapshot(snap=>{
    for(const k of[...S.items.keys()])if(k.startsWith(u+"|"))S.items.delete(k);
    for(const d of snap.docs)S.items.set(u+"|"+d.id,{...d.data(),_u:u,_id:d.id});
    setSync(snap.metadata.hasPendingWrites?"Guardando…":"Sincronizado");render();scheduleRank(u)},()=>setSync("Sin conexión")));
  gasCol(u).where("dia",">=",from).limit(1000).onSnapshot(snap=>{
    for(const k of[...S.gastos.keys()])if(k.startsWith(u+"|"))S.gastos.delete(k);
    for(const d of snap.docs)S.gastos.set(u+"|"+d.id,{...d.data(),_u:u,_id:d.id});render()},()=>{});
  db.collection("turnos/"+u+"/solicitudes").limit(200).onSnapshot(snap=>{
    for(const k of[...sols.keys()])if(k.startsWith(u+"|"))sols.delete(k);
    for(const d of snap.docs)sols.set(u+"|"+d.id,{...d.data(),_u:u,_id:d.id});render()},()=>{});
  db.collection("liq/"+u+"/dias").where("dia",">=",from).limit(200).onSnapshot(snap=>{
    for(const k of[...S.pagos.keys()])if(k.startsWith(u+"|"))S.pagos.delete(k);
    for(const d of snap.docs)S.pagos.set(u+"|"+d.id,d.data());render()},()=>{});
}

async function syncRank(u){
  if(isBaja(u))return;
  const from=addDays(today(),-65);const dias={};
  for(const[,d]of S.items)if(d._u===u&&d.dia>=from&&!isCamino(d)&&!d.diario)dias[d.dia]=(dias[d.dia]||0)+1;
  const nome=(S.people.get(u)&&S.people.get(u).nome)||"";const cur=rank.get(u);
  if(cur&&JSON.stringify(cur.dias||{})===JSON.stringify(dias)&&(cur.nome||"")===nome)return;
  if(!cur&&!Object.keys(dias).length&&!nome)return;
  try{await db.doc("ranking/"+u).set({nome,dias,atualizado:Date.now()})}catch(e){}
}

function authMsg(e){const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return"E-mail o contraseña incorrectos.";
  if(/email-already-in-use/.test(c))return"Ese e-mail ya tiene cuenta. Tocá “Entrar”.";
  if(/weak-password/.test(c))return"La contraseña necesita al menos 6 caracteres.";
  if(/invalid-email/.test(c))return"Revisá el e-mail.";
  if(/missing-password/.test(c))return"Escribí la contraseña.";
  if(/operation-not-allowed/.test(c))return"El login con e-mail todavía no está activado en Firebase.";
  if(/network/.test(c))return"Sin conexión. Probá de nuevo.";
  if(/too-many-requests/.test(c))return"Muchos intentos. Esperá unos minutos.";
  return"No se pudo entrar. Probá de nuevo."}

(function startFirebase(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey){S.mode="local";setSync("Guardado en este celular");render(true);return}
  firebase.initializeApp(cfg);auth=firebase.auth();
  try{auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
  const fs=firebase.firestore();try{fs.settings({ignoreUndefinedProperties:true})}catch(e){}
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.onAuthStateChanged(u=>{if(!u){started=false;showLogin();return}hideLogin();boot(fs,u)});
})();
async function boot(fs,u){
  const mail=(u.email||"").toLowerCase();
  if(mail===OWNER_EMAIL&&!u.emailVerified){showVerify(u);return}
  /* el permiso de dueño depende del e-mail verificado: renovar el token para que el servidor lo vea */
  if(mail===OWNER_EMAIL){try{await u.getIdToken(true)}catch(e){}}
  db=fs;const me=u.uid;isRealOwner=mail===OWNER_EMAIL;
  try{const r=await db.doc("config/roles").get();roles={socios:(r.exists&&r.data().socios)||[]}}catch(e){}
  S.me=me;S.owner=isRealOwner||roles.socios.includes(me);S.canWrite=true;
  S.mode="db";S.filter=S.owner?"all":me;S.items=new Map();S.gastos=new Map();S.egastos=new Map();S.pagos=new Map();
  let p=null;try{p=await db.doc("turnos/"+me).get()}catch(e){}
  if(p&&p.exists)S.people.set(me,p.data());
  else if(regName){try{await saveName(regName)}catch(e){}}
  else S.askName=true;
  if(!S.owner){
    db.doc("turnos/"+me).onSnapshot(s=>{
      if(!s.exists){blockScreen("Bienvenido a Tú Delivery","Escribí tu nombre para continuar.");openName();return}
      const d=s.data();S.people.set(me,d);
      if(d.baja){blockScreen("Acceso dado de baja","Tu cuenta ya no está activa en Tú Delivery.");return}
      if(!d.aprobado){blockScreen("Esperando aprobación",`Hola <b>${esc(d.nome||"")}</b>. El dueño de Tú Delivery tiene que aprobar tu cuenta. Cuando lo haga, la app se abre sola.`);return}
      if(!started){started=true;unblock();startData(me)}else render(true)},()=>{});
    return}
  startData(me);if(S.askName)openName();
}

const personName=u=>(S.people.get(u)&&S.people.get(u).nome)||(u===S.me?"Vos":"Delivery");
const isLegacy=d=>!!(d.entregador||"").trim();
const groupKey=d=>isLegacy(d)?"n:"+d.entregador.trim():d._u;
const groupName=k=>k.startsWith("n:")?k.slice(2):personName(k);
const pctOf=u=>(S.cfg.por&&S.cfg.por[u])||S.cfg.pct;
function stats(list){
  const s={n:0,total:0,efectivo:0,transferencia:0,anotado:0,fijo:0,ne:0,nt:0,na:0,nf:0,com:0,pcts:new Set()};
  for(const[,d]of list){s.total+=d.valor;
    if(d.metodo==="fijo"){s.fijo+=d.valor;if(!d.diario){s.nf++;s.n++}continue}
    s.n++;s[d.metodo]+=d.valor;s[d.metodo==="efectivo"?"ne":d.metodo==="transferencia"?"nt":"na"]++;
    const p=pctOf(d._u);s.pcts.add(p);s.com+=d.valor*p/100}
  s.com=Math.round(s.com);s.fica=s.total-s.com;s.saldo=s.com-s.anotado;
  s.pct=s.pcts.size===1?[...s.pcts][0]:(s.pcts.size?null:pctOf(S.filter==="all"?S.me:S.filter));return s}
function groups(list){const m=new Map();for(const e of list){const k=groupKey(e[1]);if(!m.has(k))m.set(k,[]);m.get(k).push(e)}
  return[...m.entries()].map(([k,l])=>({k,name:groupName(k),list:l,s:stats(l)})).sort((a,b)=>b.s.total-a.s.total)}

const visible=()=>[...new Map([...S.old,...S.items]).entries()].filter(([,d])=>!isCamino(d)&&(S.filter==="all"||d._u===S.filter));

const listDay=k=>visible().filter(([,d])=>d.dia===k).sort((a,b)=>(b[1].criadoEm||0)-(a[1].criadoEm||0));
const listRange=(a,b)=>visible().filter(([,d])=>d.dia>=a&&d.dia<=b);
const visGastos=()=>[...new Map([...S.oldG,...S.gastos]).entries()].filter(([,d])=>S.filter==="all"||d._u===S.filter);
const gastosRange=(a,b)=>visGastos().filter(([,d])=>d.dia>=a&&d.dia<=b).sort((x,y)=>(y[1].criadoEm||0)-(x[1].criadoEm||0));
function gStats(list){const g={total:0,n:list.length,tipo:{}};for(const[,d]of list){g.total+=d.valor;g.tipo[d.tipo]=(g.tipo[d.tipo]||0)+d.valor}return g}

function egStats(l){const g={total:0,n:l.length,tipo:{}};for(const d of l){g.total+=d.valor;g.tipo[d.tipo]=(g.tipo[d.tipo]||0)+d.valor}return g}
function empresaBlock(s,eg,label){const gan=s.com-eg;return `<div class="empresa"><div class="ac-h">${label}</div>

function pendientes(from,to){
  const out=[];const all=[...S.items.entries()].filter(([,d])=>!isCamino(d)&&d.dia>=from&&d.dia<=to&&!isLegacy(d)&&(S.filter==="all"||d._u===S.filter));
  const byU=new Map();for(const e of all){const u=e[1]._u;if(!byU.has(u))byU.set(u,new Map());const m=byU.get(u);if(!m.has(e[1].dia))m.set(e[1].dia,[]);m.get(e[1].dia).push(e)}
  for(const[u,days]of byU){let debe=0,recibe=0;const ds=[];
    for(const[dia,l]of days){const s=stats(l);if(!s.saldo)continue;const st=pagoState(u,dia,s);if(st&&!st.changed)continue;ds.push({dia,s});s.saldo>0?debe+=s.saldo:recibe-=s.saldo}
    if(ds.length)out.push({u,name:personName(u),ds:ds.sort((a,b)=>a.dia<b.dia?-1:1),debe,recibe})}
  return out.sort((a,b)=>(b.debe+b.recibe)-(a.debe+a.recibe))}

function clientes(){const m=new Map();for(const[,d]of visible()){const c=(d.cliente||"").trim();if(!c)continue;const k=norm(c);
  if(!m.has(k))m.set(k,{nome:c,n:0,vals:new Map(),last:0,total:0});const r=m.get(k);r.n++;r.total+=d.valor;r.vals.set(d.valor,(r.vals.get(d.valor)||0)+1);if((d.criadoEm||0)>r.last){r.last=d.criadoEm||0;r.nome=c}}
  for(const r of m.values())r.val=[...r.vals.entries()].sort((a,b)=>b[1]-a[1])[0][0];
  return[...m.values()].sort((a,b)=>b.n-a.n)}

function viewRanking(){
  const t=today();const from=addDays(t,-(rankRange-1));
  let rows;
  if(S.mode!=="db"){rows=groups(listRange(from,t)).map(g=>({u:g.k,nome:g.name,n:g.s.n}))}
  else{rows=[...rank.entries()].map(([u,r])=>{let n=0;for(const[k,c]of Object.entries(r.dias||{}))if(k>=from&&k<=t)n+=c;return{u,nome:r.nome||"Delivery",n}})}
  rows=rows.filter(r=>r.n>0||r.u===S.me).sort((a,b)=>b.n-a.n);
  const max=Math.max(1,...rows.map(r=>r.n));const total=rows.reduce((a,r)=>a+r.n,0);
  let pos=0,last=-1;
  const html=rows.map((r,i)=>{if(r.n!==last){pos=i+1;last=r.n}const me=r.u===S.me;
    return `<div class="rk-row${me?" me":""}"><span class="rk-pos ${pos<=3&&r.n?"top":""}">${pos}º</span>
      <div class="rk-main"><div class="rk-name"><b>${esc(r.nome)}</b>${me?'<span class="pill p-transfer">vos</span>':""}</div>
      <span class="rk-bar"><i style="width:${(r.n/max*100).toFixed(1)}%"></i></span></div>
      <span class="rk-n num">${r.n}<small>${r.n===1?"entrega":"entregas"}</small></span></div>`}).join("");
  return `${premiosBlock()}

  ${rows.length&&total?`<div class="list">${html}</div>`:`<div class="empty">Todavía no hay entregas en este período. El ranking aparece cuando los deliverys registren entregas.</div>`}

}

  else if(t.hasAttribute("data-equipo"))openEquipo();
  else if(t.hasAttribute("data-logout"))logout();
  else if(t.dataset.cli!==undefined){S.cliente=t.dataset.cli;const v=Number(t.dataset.cval);if(v)S.val=v;S.err="";cliFocus=false;refreshForm();drawSug();const c=document.getElementById("cli");if(c)c.value=S.cliente}
  else if(t.dataset.preset){S.val=Number(t.dataset.preset);S.err="";refreshForm()}
  else if(t.dataset.metodo){S.metodo=t.dataset.metodo;S.err="";refreshForm()}
  else if(t.hasAttribute("data-other")){S.val=0;S.err="";refreshForm();const v=document.getElementById("val");v.value="";v.focus()}
  else if(t.id==="save")save();
  else if(t.id==="savecamino")save(true);
  else if(t.dataset.fijocli){S.cliente=t.dataset.fijocli;S.err="";const c=document.getElementById("cli");if(c)c.value=S.cliente;refreshForm()}
  else if(t.dataset.diario){const r=lockReason(S.dia);if(r){lockedMsg(r);return}openDiario(t.dataset.diario)}
  else if(t.hasAttribute("data-anotar")){if(S.mode==="db"&&!S.owner&&S.canWrite===false){noPerm();return}openEntry(true);setTimeout(()=>{const c=document.getElementById("cli");if(c)c.focus()},60)}
  else if(t.hasAttribute("data-copycuenta"))copy(cuentaTxt(S.prod,S.val));
  else if(t.dataset.camino)openCamino(t.dataset.camino);
  else if(t.dataset.copyc2){const d=S.items.get(t.dataset.copyc2);if(d)copy(cuentaTxt(d.producto||0,d.valor))}
  else if(t.id==="fab"){if(S.tab!=="dia"){S.tab="dia";render(true);window.scrollTo(0,0)}if(S.mode==="db"&&!S.owner&&S.canWrite===false){noPerm();return}const r=lockReason(S.dia);if(r){lockedMsg(r);return}openEntry()}
  else if(t.hasAttribute("data-opengasto")){if(S.mode==="db"&&!S.owner&&S.canWrite===false){noPerm();return}{const r=lockReason(S.dia);if(r){lockedMsg(r);return}}if(G.emp||!GT[G.tipo]){G.emp=false;G.tipo="gasolina"}openGasto()}
  else if(t.hasAttribute("data-openegasto")){if(!G.emp||!EGT[G.tipo]){G.emp=true;G.tipo="premio"}openGasto()}
  else if(t.dataset.egdel){const k="e"+t.dataset.egdel;if(gDelArm!==k){gDelArm=k;render();setTimeout(()=>{if(gDelArm===k){gDelArm=null;render()}},3000);return}
    gDelArm=null;try{await delEGasto(t.dataset.egdel);toast("Gasto eliminado")}catch(err){toast("No se eliminó.")}}
  else if(t.dataset.edit){const d=S.items.get(t.dataset.edit);const r=d&&lockReason(d.dia);if(r){lockedMsg(r);return}openEdit(t.dataset.edit)}
  else if(t.dataset.pay){const[u,dia]=t.dataset.pay.split("|");doPay(u,dia)}
  else if(t.dataset.unpay){const[u,dia]=t.dataset.unpay.split("|");const st=pagoOf(u,dia);
    if(st&&t.textContent==="actualizar"){doPay(u,dia)}else{try{await unPago(u,dia);toast("Marcado como pendiente")}catch(err){toast("No se guardó.")}}}
  else if(t.dataset.payall){const u=t.dataset.payall;const p=pendientes(t.dataset.from,t.dataset.to).find(x=>x.u===u);if(!p)return;
    try{for(const x of p.ds)await setPago(u,x.dia,x.s);toast(plural(p.ds.length,"día")+" marcados como pagados")}catch(err){toast("No se guardó.")}}
  else if(t.dataset.range){anotRange=Number(t.dataset.range);render(true)}
  else if(t.dataset.rrange){rankRange=Number(t.dataset.rrange);render(true)}
  else if(t.dataset.info){infoMode=t.dataset.info;render(true)}
  else if(t.dataset.mes){mesOff=Math.min(0,Math.max(-2,mesOff+Number(t.dataset.mes)));render(true)}
  else if(t.dataset.goto){S.dia=t.dataset.goto;S.tab="dia";render(true);window.scrollTo(0,0)}
  else if(t.hasAttribute("data-pct"))openPct();
  else if(t.hasAttribute("data-rename"))openName();
  else if(t.hasAttribute("data-excel"))excel();
  else if(t.hasAttribute("data-copy")){let txt=resumo("Liquidación "+fromKey(S.dia).toLocaleDateString("es-PY"),listDay(S.dia));const g=gStats(gastosRange(S.dia,S.dia));
    if(g.n)txt+="\n\nGastos: "+gs(g.total)+" ("+Object.entries(g.tipo).map(([k,v])=>(GT[k]||k)+" "+gs(v)).join(", ")+")"+(hideMoney()?"":"\nLe queda limpio: "+gs(stats(listDay(S.dia)).fica-g.total));copy(txt)}
  else if(t.dataset.gtipo){G.tipo=t.dataset.gtipo;refreshG()}
  else if(t.dataset.gpreset){G.val=Number(t.dataset.gpreset);refreshG()}
  else if(t.id==="gsave")saveGasto();
  else if(t.dataset.gdel){const k=t.dataset.gdel;if(gDelArm!==k){gDelArm=k;render();setTimeout(()=>{if(gDelArm===k){gDelArm=null;render()}},3000);return}
    gDelArm=null;try{await delGasto(k);toast("Gasto eliminado")}catch(err){toast("No se eliminó.")}}
  else if(t.hasAttribute("data-copyweek")){const tk=today(),f=addDays(tk,-6);copy(resumo(`Liquidación ${ddmm(f)} al ${ddmm(tk)}`,listRange(f,tk)))}
  else if(t.hasAttribute("data-copymes")){const r=monthRange(mesOff);const ml=listRange(r.from,r.to);let txt=resumo("Resumen de "+r.label,ml);
    const top=topClientes(ml,5);if(top.length)txt+="\n\nMejores comercios:\n"+top.map((c,i)=>`${i+1}. ${c.nome}: ${plural(c.n,"entrega")}`).join("\n");copy(txt)}
});
layer.addEventListener("input",e=>{const id=e.target.id;
  if(id==="d-val"){e.target.value=fmtInput(parseVal(e.target.value));return}
  if(id.startsWith("p-")){e.target.value=e.target.value.replace(/\D/g,"").slice(0,2)}
  if(!edit)return;
  if(id==="e-val"){edit.valor=parseVal(e.target.value);e.target.value=fmtInput(edit.valor)}
  if(id==="e-prod"){edit.producto=parseVal(e.target.value);e.target.value=fmtInput(edit.producto)}
  if(id==="e-cli")edit.cliente=e.target.value;if(id==="e-obs")edit.obs=e.target.value});
layer.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="n-val"){e.preventDefault();layer.querySelector("[data-nsave]").click()}});
layer.addEventListener("click",async e=>{
  if(e.target.hasAttribute&&e.target.hasAttribute("data-close")){closeSheet();return}
  const t=e.target.closest("button");if(!t)return;
  if(t.hasAttribute("data-cancel")){closeSheet();return}
  if(t.dataset.spara){solPara=t.dataset.spara;layer.querySelectorAll("[data-spara]").forEach(c=>c.classList.toggle("on",c===t));return}
  if(t.dataset.stipo){solTipo=t.dataset.stipo;layer.querySelectorAll("[data-stipo]").forEach(c=>c.classList.toggle("on",c===t));return}
  if(t.hasAttribute("data-ssave")){const det=document.getElementById("s-det").value.trim();if(solTipo==="otro"&&!det){toast("Escribí qué necesitás");return}
    const para=S.owner?solPara:S.me;if(!para){toast("Elegí el delivery");return}
    const doc={tipo:solTipo,detalle:det,estado:"pendiente",criadoEm:Date.now()};if(S.owner)doc.porDueno=true;
    closeSheet();try{await db.collection("turnos/"+para+"/solicitudes").doc(uid()).set(doc);toast(S.owner?"Solicitud registrada para "+personName(para):"Solicitud enviada")}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="permission-denied"))noPerm();else toast("No se envió. Probá de nuevo.")}return}
  if(t.dataset.rsave){const r=document.getElementById("r-txt").value.trim();const k=t.dataset.rsave;closeSheet();try{await setSol(k,{respuesta:r});toast("Respuesta guardada")}catch(err){toast("No se guardó.")}return}
  if(t.dataset.baja){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="¿Confirmar baja?";return}
    try{await setBaja(t.dataset.baja,true);toast("Delivery dado de baja");openEquipo()}catch(err){toast("No se guardó.")}return}
  if(t.dataset.aprobar){try{await aprobar(t.dataset.aprobar);toast("Delivery aprobado");setTimeout(openEquipo,400)}catch(err){toast("No se guardó.")}return}
  if(t.dataset.socio){try{await setSocio(t.dataset.socio,t.dataset.on==="1");toast(t.dataset.on==="1"?"Ahora es socio":"Ya no es socio");openEquipo()}catch(err){toast("No se guardó.")}return}
  if(t.hasAttribute("data-logout")){logout();return}
  if(t.dataset.reactivar){try{await setBaja(t.dataset.reactivar,false);toast("Delivery reactivado");openEquipo()}catch(err){toast("No se guardó.")}return}
  if(t.dataset.dvia){layer.querySelectorAll("[data-dvia]").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t.dataset.dsave){const v=parseVal(document.getElementById("d-val").value);if(!v){toast("Escribí el monto del diario");return}
    const via=(layer.querySelector('[data-dvia][aria-pressed="true"]')||{dataset:{dvia:"efectivo"}}).dataset.dvia;
    const when=S.dia===today()?new Date():new Date(fromKey(S.dia).setHours(20,0,0,0));
    const d={valor:v,metodo:"fijo",diario:true,via,cliente:t.dataset.dsave,obs:"Diario",dia:S.dia,criadoEm:when.getTime()};
    closeSheet();try{await addItem(d,writeTarget());toast("Diario guardado: "+gs(v))}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="permission-denied"))noPerm();else toast("No se guardó.")}return}
  if(t.dataset.copyc){const d=S.items.get(t.dataset.copyc);if(d)copy(cuentaTxt(d.producto||0,d.valor));return}
  if(t.dataset.entregado){const k=t.dataset.entregado,how=t.dataset.how,d=S.items.get(k);if(!d)return;
    if(how==="anotado"&&!(d.cliente||"").trim()){toast("Para anotar, el pedido necesita nombre de cliente");return}
    const r=S.mode==="db"&&!S.owner&&pagoOf(S.me,today())?"Hoy ya fue liquidado. Pedile al dueño que lo registre.":"";if(r){lockedMsg(r);return}
    closeSheet();try{await patchItem(k,{estado:"ok",metodo:how,dia:today(),criadoEm:Date.now()});toast("Entrega finalizada · "+M[how].n)}catch(err){toast("No se guardó.")}return}
  if(t.dataset.cdel){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Tocá de nuevo para quitarlo";return}
    const k=t.dataset.cdel;closeSheet();try{await delItem(k);toast("Quitado de la lista")}catch(err){toast("No se eliminó.")}return}
  if(t.hasAttribute("data-nsave")){const n=document.getElementById("n-val").value.trim();if(!n){toast("Escribí tu nombre");return}closeSheet();try{await saveName(n);toast("Nombre guardado")}catch(err){noPerm()}return}
  if(t.hasAttribute("data-psave")){const g=parseVal(document.getElementById("p-gen").value);if(!g||g>=100){toast("Usá un número entre 1 y 99");return}
    const por={};let bad=false;layer.querySelectorAll("[data-pu]").forEach(i=>{const v=parseVal(i.value);if(i.value&&(!v||v>=100))bad=true;if(v&&v<100&&v!==g)por[i.dataset.pu]=v});
    if(bad){toast("Usá números entre 1 y 99");return}
    closeSheet();try{await saveCfg({pct:g,por});toast("Comisiones guardadas")}catch(err){toast("No se guardó.")}return}
  if(!edit)return;
  if(t.dataset.emetodo){edit.metodo=t.dataset.emetodo;edit.armed=false;drawSheet()}
  else if(t.hasAttribute("data-esave")){if(!edit.valor){toast("Escribí el monto");return}
    const p={valor:edit.valor,producto:edit.producto||0,metodo:edit.metodo,cliente:edit.cliente.trim(),obs:edit.obs.trim()};
    const k=edit.key;closeSheet();try{await patchItem(k,p);toast("Entrega actualizada")}catch(err){toast("No se guardó.")}}
  else if(t.hasAttribute("data-edel")){if(!edit.armed){edit.armed=true;drawSheet();return}
    const k=edit.key;closeSheet();try{await delItem(k);toast("Entrega eliminada")}catch(err){toast("No se eliminó.")}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer.innerHTML&&!document.getElementById("n-val"))closeSheet()});
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
