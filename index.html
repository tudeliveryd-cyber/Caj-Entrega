<style>
/* Layout: one-column phone ledger — day summary up top, quick entry, then the day's list; tabs for fiados and week */
:root{
  --bg:#F3F1F7; --surface:#FFFFFF; --ink:#1E1630; --muted:#665E75; --line:#DCD7E5;
  --accent:#331A5B; --accent-ink:#FFFFFF; --road:#331A5B;
  --cash:#1E7A4C; --transfer:#2D5FA8; --due:#B4501A;
  --cash-bg:#E3F2E9; --transfer-bg:#E5ECF7; --due-bg:#F8E8DE;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1D1726; --ink:#ECE8F3; --muted:#A49CB3; --line:#2F2740;
  --accent:#B9A2E6; --accent-ink:#1A0F2E; --road:#2A1550;
  --cash:#5FCB8F; --transfer:#86AEEB; --due:#F0935A;
  --cash-bg:#17301F; --transfer-bg:#1A2638; --due-bg:#36221A; color-scheme:dark}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1D1726; --ink:#ECE8F3; --muted:#A49CB3; --line:#2F2740;
  --accent:#B9A2E6; --accent-ink:#1A0F2E; --road:#2A1550;
  --cash:#5FCB8F; --transfer:#86AEEB; --due:#F0935A;
  --cash-bg:#17301F; --transfer-bg:#1A2638; --due-bg:#36221A; color-scheme:dark}
:root[data-accent="azul"]{--accent:#1F4E8C;--road:#1F4E8C}
:root[data-accent="verde"]{--accent:#1E6B47;--road:#1E6B47}
:root[data-accent="naranja"]{--accent:#B44E12;--road:#9A4210}
:root[data-accent="rosa"]{--accent:#9C2560;--road:#8A1F55}
:root[data-accent="grafito"]{--accent:#2B2B33;--road:#2B2B33}
:root[data-accent="azul"]:not([data-theme="light"]){--accent:#8FB4F0;--road:#16325A}
:root[data-theme="dark"][data-accent="azul"]{--accent:#8FB4F0;--road:#16325A}
:root[data-accent="verde"]:not([data-theme="light"]){--accent:#6FCF97;--road:#15402B}
:root[data-theme="dark"][data-accent="verde"]{--accent:#6FCF97;--road:#15402B}
:root[data-accent="naranja"]:not([data-theme="light"]){--accent:#F2A365;--road:#4A2410}
:root[data-theme="dark"][data-accent="naranja"]{--accent:#F2A365;--road:#4A2410}
:root[data-accent="rosa"]:not([data-theme="light"]){--accent:#EE8FB9;--road:#4A1530}
:root[data-theme="dark"][data-accent="rosa"]{--accent:#EE8FB9;--road:#4A1530}
:root[data-accent="grafito"]:not([data-theme="light"]){--accent:#C9C9D1;--road:#1E1E24}
:root[data-theme="dark"][data-accent="grafito"]{--accent:#C9C9D1;--road:#1E1E24}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--road)}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--road);color:#F3F6F2;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.brand{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:22px;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand .logo{width:46px;height:38px;border-radius:7px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.brand span{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand small{font-family:var(--body);font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:#C9BEDD;margin-top:3px}
.sync{font-size:12px;color:#C9BEDD}
nav.tabs{display:flex;gap:4px;max-width:640px;margin:12px auto 0}
nav.tabs button{flex:1;background:none;border:0;color:#C9BEDD;font:600 14px var(--body);padding:10px 4px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--due);color:#fff;font-size:11px;line-height:18px}
main{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.daylabel{text-align:center;min-width:0}
.daylabel b{display:block;font-family:var(--display);font-stretch:85%;font-size:20px;font-weight:700;text-transform:capitalize}
.daylabel span{font-size:12px;color:var(--muted)}
/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sum-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 16px 12px;flex-wrap:wrap}
.sum-head .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:38px;line-height:1}
.count{text-align:right}
.count .big{font-size:30px}
.split{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.split>div{padding:10px 12px;min-width:0}
.split>div+div{border-left:1px solid var(--line)}
.split .k{font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.split .v{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .n{font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.c-cash{color:var(--cash)} .c-transfer{color:var(--transfer)} .c-due{color:var(--due)}
.d-cash{background:var(--cash)} .d-transfer{background:var(--transfer)} .d-due{background:var(--due)}
.caixa{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--cash-bg);border-top:1px solid var(--line);flex-wrap:wrap}
.caixa .t{font-size:13px;min-width:0}
.caixa .t small{display:block;color:var(--muted);font-size:12px}
.caixa .v{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:22px;color:var(--cash)}
a.linkbtn{display:inline-block}
.linkbtn{background:none;border:0;color:var(--ink);font:600 13px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
/* entry */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.entry h2,.sec h2{margin:0;font-family:var(--display);font-stretch:80%;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.money{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg)}
.money:focus-within{border-color:var(--accent)}
.money span{font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted)}
.money input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--display);font-stretch:85%;font-weight:800;font-size:34px;outline:none;padding:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.method{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 6px;font:600 14px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.method svg{width:22px;height:22px}
.method[aria-pressed="true"].m-cash{border-color:var(--cash);background:var(--cash-bg);color:var(--cash)}
.method[aria-pressed="true"].m-transfer{border-color:var(--transfer);background:var(--transfer-bg);color:var(--transfer)}
.method[aria-pressed="true"].m-due{border-color:var(--due);background:var(--due-bg);color:var(--due)}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:15px var(--body);background:var(--bg);color:var(--ink);width:100%}
.field input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px;font:600 15px var(--body);cursor:pointer}
.danger{background:none;border:1px solid var(--due);color:var(--due);border-radius:12px;padding:13px;font:600 15px var(--body);cursor:pointer}
.danger.armed{background:var(--due);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--due);font-size:13px;margin:-6px 0 0}
/* list */
.sec{display:grid;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h span{font-size:13px;color:var(--muted)}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row .time{font-size:13px;color:var(--muted)}
.row .who{min-width:0}
.row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right}
.row .amt b{font-family:var(--display);font-stretch:85%;font-size:17px;font-weight:700;display:block}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.p-cash{background:var(--cash-bg);color:var(--cash)} .p-transfer{background:var(--transfer-bg);color:var(--transfer)} .p-due{background:var(--due-bg);color:var(--due)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
/* fiados */
.due-total{background:var(--due-bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.due-total .big{color:var(--due);font-size:32px}
.due-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.due-row:first-child{border-top:0}
.due-row .who{min-width:0}
.due-row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-row .who small{color:var(--muted);font-size:12px}
.due-row .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.due-row .r b{font-family:var(--display);font-stretch:85%;font-size:17px}
.small{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font:600 13px var(--body);cursor:pointer}
.small.cash{border-color:var(--cash);color:var(--cash)} .small.transfer{border-color:var(--transfer);color:var(--transfer)}
.group-h{padding:8px 14px;background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.group-h:first-child{border-top:0}
/* week */
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 0}
.wrow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer}
.wrow .d{font-size:13px;text-transform:capitalize}
.wrow .d small{display:block;color:var(--muted);font-size:11px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--bg);min-width:0}
.bar i{display:block;height:100%}
.wrow .t{text-align:right;font-family:var(--display);font-stretch:85%;font-weight:700;font-size:15px;min-width:86px}
.wrow .t small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.wk-tot{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:24px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:92%;overflow:auto}
.sheet h3{margin:0;font-family:var(--display);font-stretch:85%;font-size:20px}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.method small{font-size:11px;font-weight:500;opacity:.8}
.acerto{border-top:1px solid var(--line);background:var(--bg);padding:12px 16px;display:grid;gap:6px}
.ac-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ac-row,.ac-res{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ac-row span{font-size:14px;min-width:0}
.ac-row b{font-family:var(--display);font-stretch:85%;font-size:16px;white-space:nowrap}
.ac-res{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.ac-res span{font-weight:700;font-size:15px}
.ac-res b{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:24px;white-space:nowrap}
.ac-foot{font-size:12px;color:var(--muted)}
.drv-table{border-top:1px solid var(--line)}
.drv-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.drv-row:first-child{border-top:0}
.drv-row .who{min-width:0}.drv-row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drv-row small{color:var(--muted);font-size:12px;display:block}
.drv-row .r{text-align:right}.drv-row .r b{font-family:var(--display);font-stretch:85%;font-size:17px}
.sum-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted-r{text-align:right;color:var(--muted);font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;color:var(--ink);font:600 14px var(--body);padding:9px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sheet .money input{font-size:28px}
/* keep everything inside the phone width */
html{overflow-x:hidden}
body{max-width:100%;overflow-x:clip}
main,header.top,.summary,.entry,.list,.sheet{max-width:100%}
main>*,.entry>*,.sec>*,.field>*{min-width:0}
.methods,.split,.wk-tot,.seg{grid-template-columns:repeat(3,minmax(0,1fr))}
.wk-tot{grid-template-columns:repeat(2,minmax(0,1fr))}
.method,.chip,.tile,.split div,.ac-row span,.ac-res span{min-width:0}
.method{text-align:center;overflow-wrap:anywhere;padding:10px 4px;font-size:13px}
.method small{font-size:10px;line-height:1.2}
.ac-row b,.ac-res b{white-space:nowrap;text-align:right;flex:none}
.ac-row span,.ac-res span{flex:1;min-width:0}
.ac-res b{font-size:22px}
.big{font-size:32px}
.count .big{font-size:26px}
.split>div{padding:10px 8px}
.split .v{font-size:15px}
.wrow{grid-template-columns:60px minmax(0,1fr) auto}
.wrow .t{min-width:0}
.row{grid-template-columns:40px minmax(0,1fr) auto}
.tile .v{font-size:20px;overflow-wrap:anywhere}
.brand{font-size:19px;min-width:0}
.sync{white-space:nowrap}
@media (max-width:360px){.big{font-size:28px}.split .v{font-size:13px}.money input{font-size:28px}}
.chip.other{border-style:dashed;border-color:var(--muted)}
.money input::placeholder{font-size:20px;font-weight:600;color:var(--muted)}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.who-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.rk-head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rk-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.rk-row:first-child{border-top:0}
.rk-row.me{background:var(--transfer-bg)}
.rk-pos{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:18px;color:var(--muted)}
.rk-pos.top{color:var(--accent)}
.rk-main{min-width:0;display:grid;gap:6px}
.rk-name{display:flex;align-items:center;gap:6px;min-width:0}
.rk-name b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-bar{display:block;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rk-n{text-align:right;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:22px;line-height:1}
.rk-n small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
nav.tabs button{padding-left:2px;padding-right:2px;font-size:13px}
.perm-warn{display:grid;gap:4px;background:var(--due-bg);border:1px solid var(--due);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}

.caja{display:grid;gap:10px;border:1px solid #d9a93a;border-radius:16px;padding:14px;background:color-mix(in srgb,#d9a93a 7%,var(--surface))}
.caja.cerrada{border-color:var(--line);background:var(--surface)}
.caja-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.caja-h b{font-size:16px}.caja-h small{color:var(--muted);font-size:12.5px}
.caja-rows{display:grid;gap:5px;font-size:14.5px}.caja-rows>div{display:flex;justify-content:space-between;gap:10px}.caja-rows span{color:var(--muted)}
.caja-esp{border-top:1px solid var(--line);padding-top:7px;margin-top:2px}.caja-esp span{color:var(--ink)!important;font-weight:700}.caja-esp b{font-size:18px}
.caja-rows.mini .caja-esp{border:0;padding:0}
.caja-dif{border-radius:10px;padding:8px 10px;margin-top:4px;font-weight:700}.caja-dif span{color:inherit!important}
.caja-dif.ok{background:color-mix(in srgb,#2e9e5b 16%,transparent);color:#2e9e5b}.caja-dif.falta{background:var(--due-bg);color:var(--due)}.caja-dif.sobra{background:color-mix(in srgb,#4a8fe0 14%,transparent);color:#4a8fe0}
.caja-act{display:flex;gap:12px;align-items:center}
.caja-lock{color:var(--muted);font-size:13px}
.caja-ini{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.caja-ini svg{width:20px;height:20px;flex:none;color:var(--accent)}.caja-ini span{display:grid;gap:2px}.caja-ini small{color:var(--muted);font-size:12.5px}
.p0{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font:600 13px var(--body)}
.p0.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.caja-desp{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,#e0a030 16%,transparent);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:14px}
.caja-desp svg{width:18px;height:18px;flex:none;margin-top:1px;color:#c98a10}
.caja-reab{color:var(--muted);font-size:12.5px}
.caja-note{color:var(--muted);font-size:12.5px;line-height:1.4}
.direct-link{border:0!important;background:none!important;color:var(--muted)!important;text-decoration:underline;font-size:14px!important;padding:6px!important;box-shadow:none!important}
.cierre-cam{display:grid;gap:4px}
.cam-grp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--accent) 12%,transparent);border-top:1px solid var(--line);font-size:14.5px}.cam-grp:first-child{border-top:0}.cam-grp span{color:var(--muted);font-size:12.5px;margin-left:auto}
.cam-old .who small{color:var(--due)}.cierre-cam small{font-weight:500}
.caja-fuera{display:grid;gap:5px;font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.caja-fuera>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.caja-fuera b{white-space:nowrap}.caja-fuera span{color:var(--muted)}
.cf-h{font-size:11.5px!important;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.caja-fuera small{color:var(--muted);font-size:12px}
.cf-tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}.cf-tot span{color:var(--ink)!important;font-weight:600}
.caja-reset{justify-self:start;color:var(--due)!important}.caja-reset.armed{font-weight:800}.caja-act .primary{flex:1}
.cta-mine{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--body);cursor:pointer}
.cta-mine small{display:block;color:var(--muted);font-size:12.5px}.cta-mine.due{border-color:var(--due)}.cta-mine.due b.num{color:var(--due)}.cta-mine.cash b.num{color:#2e9e5b}
.cf-open{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--body);cursor:pointer}
.cf-open small{display:block;color:var(--muted);font-size:12.5px}
.cf-row{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.cf-row:first-child{border-top:0}
.cf-row .who{display:grid;gap:2px;min-width:0}.cf-row b{font-size:16px}.cf-dir{font-size:13.5px;color:var(--ink)}.cf-row small{color:var(--muted);font-size:12.5px}
.cf-act{display:flex;gap:8px;flex-wrap:wrap}.cf-act .map-btn{text-decoration:none}
.cf-chips{display:grid;gap:4px}
.cat-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:16px var(--body);text-align:left;cursor:pointer}.cat-row:first-child{border-top:0}
.cat-row .cat-tx{display:grid;gap:2px;flex:1}
.cat-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);flex:none}.cat-ic .ic{width:22px;height:22px}
.cat-title{display:flex;align-items:center;gap:10px}.cat-title .cat-ic{width:32px;height:32px}.cat-title .cat-ic .ic{width:18px;height:18px}.cat-row small{color:var(--muted);font-size:12.5px}.cat-go{color:var(--muted);font-size:22px}.cat-all b{color:var(--accent)}
.cat-back{justify-self:start;font-weight:700}.cat-title{font:800 15px var(--body);margin:4px 0 8px}
.cf-cat{font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.cf-cats .chip{font-size:14px}
.geo-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.geo-main{width:100%;padding:13px!important;margin-bottom:8px;font-size:15.5px!important;border-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 14%,var(--surface))!important}
#mappick{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto}
#mappick .mp-top{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;display:grid;gap:2px;background:var(--surface);border-bottom:1px solid var(--line)}
#mappick .mp-top b{font-size:15px}#mappick .mp-top small{color:var(--muted);font-size:12.5px}
#mappick .mp-wrap{position:relative;min-height:0}#mp-map{position:absolute;inset:0}
#mappick .mp-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);color:#e0443e;pointer-events:none;z-index:500}
#mappick .mp-pin .ic{width:44px;height:44px;stroke-width:2.2;fill:color-mix(in srgb,#e0443e 25%,transparent);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
#mappick .mp-layers{position:absolute;right:12px;top:12px;z-index:600;display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.25)}
#mappick .mp-layers button{border:0;padding:8px 12px;background:var(--surface);color:var(--ink);font:600 13.5px var(--body)}#mappick .mp-layers button.on{background:var(--accent);color:#1a1422}
#mappick .mp-me{position:absolute;right:12px;bottom:16px;z-index:600;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#mappick .mp-bot{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--surface);border-top:1px solid var(--line)}.geo-b{padding:12px 8px!important;font-size:14.5px!important}
.geo-res{display:grid;gap:6px;margin-bottom:8px}.geo-msg{font-size:13.5px;color:var(--muted)}
.geo-hit{display:grid;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:15px var(--body);cursor:pointer}.geo-hit small{color:var(--muted);font-size:12.5px}
.gm-btn{display:block;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--ink)!important;text-decoration:none;font:700 15px var(--body)}
.gm-steps{margin:2px 0 0;padding-left:20px;font-size:13.5px;color:var(--muted);display:grid;gap:2px}.gm-steps b{color:var(--ink)}
.geo-prev{display:grid;gap:4px;margin-top:8px}.geo-prev iframe{width:100%;height:190px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.geo-prev small{color:var(--muted);font-size:12.5px}
.cf-row mark{background:#d9a93a;color:#1a1422;border-radius:3px;padding:0 1px}
.cf-count{font-size:12.5px;color:var(--muted);margin:0}.cf-chips small{color:var(--muted);font-size:12.5px}
.who-bar .wb-act{flex-wrap:wrap}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block}
.ic-checkc,.ic-dot{color:#2e9e5b}.ic-star{color:#d9a93a}.ic-flame{color:#e8743b}.ic-alert{color:var(--due)}.ic-gift{color:#d9a93a}
/* app fijo: sin zoom ni desplazamiento lateral en el iPhone */
body{touch-action:pan-y}
.chat-seg,.filter{touch-action:pan-x pan-y}
input:not(.money input):not(.nt-title):not(.stepper input),textarea,select{font-size:16px!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;white-space:nowrap}
.note{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

/* standalone app: base reset + login */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:40;background:var(--road);overflow:auto;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.lg-box{width:100%;max-width:420px;background:var(--surface);color:var(--ink);border-radius:18px;padding:24px 20px;display:grid;gap:14px;text-align:center}
.lg-logo{margin:0 auto;border-radius:16px}
.lg-box h1{margin:0;font-family:var(--display);font-stretch:80%;font-weight:800;font-size:28px;text-transform:uppercase}
.lg-sub{margin:-8px 0 0;color:var(--muted)}
.lg-form{display:grid;gap:12px;text-align:left}
.lg-form .linkbtn{justify-self:center}
.block{display:grid;gap:12px;justify-items:center;text-align:center;padding:40px 8px}
.block img{border-radius:16px}.block h2{margin:0;font-family:var(--display);font-stretch:85%}.block p{margin:0;color:var(--muted);max-width:340px}
.team-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge-in{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--due);color:#fff;font-size:11px;line-height:18px}
.wb-act{display:flex;gap:14px}
/* ===================== VISUAL PREMIUM · ROXO ESCURO (solo apariencia) ===================== */
:root:not([data-theme="light"]){
  --bg:#0D0915; --surface:#171026; --surface-2:#1F1633; --ink:#F6F2FD; --muted:#B4A8CC; --line:#2C2242;
  --accent:#B08CFF; --accent-ink:#150B28; --accent-2:#8B5CF6; --road:#1A0F31;
  --cash:#4FD69A; --transfer:#8DB8FF; --due:#F5B342; --err:#FF6B6B;
  --cash-bg:#10291E; --transfer-bg:#152340; --due-bg:#33260F; --glow:rgba(176,140,255,.16);
  --card-grad:linear-gradient(180deg,#1A122B 0%,#150E23 100%); --shadow:0 10px 28px rgba(0,0,0,.42),0 1px 0 rgba(255,255,255,.03) inset}
:root[data-theme="dark"]{
  --bg:#0D0915; --surface:#171026; --surface-2:#1F1633; --ink:#F6F2FD; --muted:#B4A8CC; --line:#2C2242;
  --accent:#B08CFF; --accent-ink:#150B28; --accent-2:#8B5CF6; --road:#1A0F31;
  --cash:#4FD69A; --transfer:#8DB8FF; --due:#F5B342; --err:#FF6B6B;
  --cash-bg:#10291E; --transfer-bg:#152340; --due-bg:#33260F; --glow:rgba(176,140,255,.16);
  --card-grad:linear-gradient(180deg,#1A122B 0%,#150E23 100%); --shadow:0 10px 28px rgba(0,0,0,.42),0 1px 0 rgba(255,255,255,.03) inset}
:root{--accent-2:var(--accent);--err:#C83C3C;--glow:rgba(51,26,91,.08);--card-grad:var(--surface);--shadow:0 4px 14px rgba(30,15,60,.08);--surface-2:var(--surface)}
/* acentos alternativos siguen funcionando: el degradado del botón usa el acento elegido */
:root[data-accent]:not([data-accent="morado"]){--accent-2:var(--accent)}

/* fondo con brillo violeta suave */
body{background:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%) fixed,var(--bg);letter-spacing:.005em}
body::before{background:linear-gradient(180deg,#24124A,#1A0F31)}

/* encabezado */
header.top{background:linear-gradient(180deg,#26134D 0%,#1A0F31 100%);border-bottom:1px solid rgba(176,140,255,.18);box-shadow:0 8px 24px rgba(8,4,18,.45)}
:root[data-theme="light"] header.top{border-bottom-color:transparent}
.brand{letter-spacing:.02em}
.clock{text-shadow:0 2px 12px rgba(176,140,255,.25)}
.sync{opacity:.85}

/* tarjetas */
.summary,.list,.tile,.who-bar,.caja,.aviso,.msg-dia,.cumple-mes,.cumple-hoy,.dst,.deu-box,.ac-note,.ret-box,.cta-mine,.meta,.cierre,.pend,.caja-open,.vp-btn,.empty,.rd-msg,.hist-tot>div,.conf-row,.cumple-prox,.aviso-min,.lg-box{border-radius:18px}
.summary,.list,.tile,.who-bar,.caja,.msg-dia,.cumple-mes,.dst,.cta-mine,.meta,.pend,.caja-open,.vp-btn,.aviso,.cumple-hoy,.lg-box{box-shadow:var(--shadow)}
:root:not([data-theme="light"]) :is(.summary,.list,.tile,.who-bar,.msg-dia,.cumple-mes,.meta,.pend,.vp-btn,.lg-box,.cumple-prox,.deu-box,.ac-note,.ret-box){background:var(--card-grad);border-color:rgba(176,140,255,.13)}
:root[data-theme="dark"] :is(.summary,.list,.tile,.who-bar,.msg-dia,.cumple-mes,.meta,.pend,.vp-btn,.lg-box,.cumple-prox,.deu-box,.ac-note,.ret-box){background:var(--card-grad);border-color:rgba(176,140,255,.13)}
.row{transition:background .15s}.row:active{background:var(--glow)}
.sec-h h2,.sec h2{letter-spacing:.07em}
.lbl,.sum-head .lbl{letter-spacing:.1em;color:var(--muted)}
.pill{font-weight:700;letter-spacing:.01em}

/* botones */
.primary{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-radius:14px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent-2) 38%,transparent);text-shadow:0 1px 0 rgba(0,0,0,.18)}
:root[data-theme="light"] .primary{color:var(--accent-ink);text-shadow:none}
.primary:active,.ghost:active,.chip:active,.method:active,.fab:active{transform:scale(.98)}
.primary:disabled{box-shadow:none}
.ghost{border-radius:14px;border-color:color-mix(in srgb,var(--accent) 28%,var(--line));background:color-mix(in srgb,var(--accent) 5%,transparent)}
.danger{border-color:var(--err);color:var(--err);border-radius:14px}
.fab{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;box-shadow:0 10px 26px color-mix(in srgb,var(--accent-2) 45%,rgba(0,0,0,.4))}
:root[data-theme="light"] .fab{color:var(--accent-ink)}
.chip,.nt-open{border-color:color-mix(in srgb,var(--accent) 22%,var(--line));background:var(--surface-2)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
:root[data-theme="light"] .chip.on{color:var(--accent-ink)}
.seg{border-radius:14px;background:var(--surface-2);border-color:rgba(176,140,255,.12)}
.seg button{border-radius:10px}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent-2) 35%,transparent)}
:root[data-theme="light"] .seg button[aria-pressed="true"]{color:var(--accent-ink)}
.method{border-radius:14px;background:var(--surface-2);border-color:var(--line)}
.linkbtn{text-underline-offset:3px}

/* campos */
.money,.field input,.field textarea,.field select,.nt-text,.deu-form>input,.cum-row select{border-radius:14px}
.money input,.field .money input{border:0!important;background:none!important;box-shadow:none!important;outline:none!important;padding-left:0}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.field input:focus,.field textarea:focus,.deu-form>input:focus{outline:2px solid var(--accent);box-shadow:0 0 0 4px var(--glow)}
.field label{letter-spacing:.02em}

/* hojas (modales) */
.scrim{background:rgba(6,3,12,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{border-radius:24px 24px 0 0;border-top:1px solid rgba(176,140,255,.18);box-shadow:0 -12px 40px rgba(0,0,0,.45);position:relative}
.sheet::before{content:"";position:static;justify-self:center;width:42px;height:4px;border-radius:4px;background:color-mix(in srgb,var(--muted) 45%,transparent);margin:-8px 0 -6px}
:root:not([data-theme="light"]) .sheet{background:linear-gradient(180deg,#1C1430 0%,#150E23 60%)}
:root[data-theme="dark"] .sheet{background:linear-gradient(180deg,#1C1430 0%,#150E23 60%)}
.sheet-h h3{letter-spacing:.01em}
.x{border-radius:50%}

/* barra de pestañas */
nav.tabs{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(176,140,255,.14);box-shadow:0 -8px 24px rgba(0,0,0,.25)}
:root:not([data-theme="light"]) nav.tabs{background:rgba(18,12,30,.86)}
:root[data-theme="dark"] nav.tabs{background:rgba(18,12,30,.86)}
nav.tabs button{border-radius:14px;transition:color .15s,background .15s}
nav.tabs button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
nav.tabs button[aria-selected="true"] svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 55%,transparent))}

/* avisos y estados */
.toast{border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
:root:not([data-theme="light"]) .toast{background:rgba(246,242,253,.95);color:#160C2B}
.err{color:var(--err)}
.caja-dif.falta{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
.cta-red{color:var(--err)!important}
.badge-in,nav.tabs .badge{box-shadow:0 0 0 2px var(--bg)}

/* refuerzo premium (solo modo oscuro) */
:root:not([data-theme="light"]){--bd:rgba(176,140,255,.2)}
:root[data-theme="dark"]{--bd:rgba(176,140,255,.2)}
:root{--bd:var(--line)}
body{background:radial-gradient(700px 380px at 15% -80px,rgba(139,92,246,.22),transparent 70%) fixed,radial-gradient(600px 320px at 100% 30%,rgba(176,140,255,.07),transparent 70%) fixed,var(--bg)}
:root[data-theme="light"] body{background:var(--bg)}
:is(.summary,.list,.tile,.who-bar,.msg-dia,.cumple-mes,.meta,.pend,.vp-btn,.lg-box,.cumple-prox,.deu-box,.ac-note,.ret-box,.empty){border-color:var(--bd)}
:is(.summary,.list,.tile,.who-bar,.msg-dia,.meta,.pend,.vp-btn){box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04)}
.sec-h h2,.sec>h2{display:flex;align-items:center;gap:8px}
.sec-h h2::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2));flex:none}
.sum-head .big{background:linear-gradient(180deg,#FFFFFF 30%,#D9C9FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .sum-head .big{background:none;color:var(--ink)}

.tile .v{font-size:25px;letter-spacing:.01em}

.who-bar{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.vp-btn{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}

.pts-card,.caja-open{border-radius:18px}

.dl-tools{display:grid;gap:8px}.dl-q{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:14px;background:var(--surface-2);padding:0 12px}
.dl-q svg{width:18px;height:18px;color:var(--muted);flex:none}.dl-q input{flex:1;min-width:0;border:0;background:none;color:var(--ink);padding:11px 0;font:15px var(--body);outline:none}
.dl-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.dl-chips::-webkit-scrollbar{display:none}.dl-chips .chip{flex:none;padding:6px 12px;font-size:13px}
#dl-list .row[hidden]{display:none!important}
.av-img{object-fit:cover;padding:0;background:var(--surface-2)}
.foto-prev{display:grid;place-items:center;padding:6px 0}.foto-prev img,.foto-prev .av-big{width:120px;height:120px;border-radius:50%;object-fit:cover;font-size:40px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 40%,transparent)}
.foto-btn{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.foto-btn svg{width:20px;height:20px}
.rg-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rg-pick input{width:100%;border:1px solid var(--bd);border-radius:14px;padding:11px 12px;background:var(--surface-2);color:var(--ink);font:16px var(--body);color-scheme:dark}

.cfg-it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--bd);background:none;color:var(--ink);padding:12px 14px;font:inherit}.cfg-it:first-child{border-top:0}
.cfg-it>svg{width:20px;height:20px;color:var(--accent);flex:none}.cfg-it span:not(.caja-go){display:grid;gap:1px;flex:1;min-width:0}.cfg-it small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.cfg-out,.cfg-out>svg{color:var(--err)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;font:800 12px var(--display);letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 52%),hsl(calc(var(--h) + 40) 60% 38%));box-shadow:0 0 0 2px color-mix(in srgb,var(--bg) 70%,transparent);margin-right:2px}
.vp-row .who b{display:flex;align-items:center;gap:8px}.vp-row .av{width:26px;height:26px;font-size:11px}
.charts{display:grid;gap:10px}
.chart-card{border:1px solid var(--bd);border-radius:18px;padding:14px;background:var(--card-grad);box-shadow:var(--shadow)}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}.chart-h b{font-size:15px}.chart-h small{color:var(--muted);font-size:12.5px}
.chart-bars{width:100%;height:auto;display:block}.chart-bars .cb{fill:color-mix(in srgb,var(--accent) 55%,transparent)}.chart-bars .cb-top{fill:var(--accent)}
.chart-bars .cx{fill:var(--muted);font-size:9px;text-anchor:middle;font-family:var(--body)}
.donut-wrap{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}.donut{width:120px;height:120px}
.dn-n{fill:var(--ink);font:800 22px var(--display);text-anchor:middle}.dn-l{fill:var(--muted);font:500 10px var(--body);text-anchor:middle}
.donut-leg{display:grid;gap:6px;font-size:13.5px}.donut-leg>div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}.donut-leg i{width:12px;height:12px;border-radius:4px}

/* tablet y computadora: contenido centrado y cómodo */
@media (min-width:700px){main{max-width:680px;margin-inline:auto}.sheet{max-width:620px;border-radius:24px;margin-bottom:24px}.scrim{align-items:center}}
@media (min-width:1100px){body{font-size:16px}}
/* ===== Pase 2: estilo del modelo (tarjetas de color con ícono, grilla de accesos, podio) — solo apariencia ===== */
/* saludo y clima en tarjetas con degradé */
:root:not([data-theme="light"]) .msg-dia{background:linear-gradient(135deg,#2E1A5C 0%,#1E1240 70%);border-color:rgba(176,140,255,.22)}
:root[data-theme="dark"] .msg-dia{background:linear-gradient(135deg,#2E1A5C 0%,#1E1240 70%);border-color:rgba(176,140,255,.22)}
.msg-dia .msg-h{font-size:17px}
:root:not([data-theme="light"]) .clima{background:linear-gradient(135deg,#1E1A44 0%,#191433 100%);border-color:rgba(141,184,255,.28)}
:root[data-theme="dark"] .clima{background:linear-gradient(135deg,#1E1A44 0%,#191433 100%);border-color:rgba(141,184,255,.28)}
.clima{border-radius:18px;box-shadow:var(--shadow)}

/* resumen: Entró / Gastos / Queda como tarjetas de color */
.neto{border:0;gap:8px;overflow:visible;margin:0 14px 12px}
.neto>div{border:1px solid var(--bd);border-radius:14px;padding:11px 12px;position:relative}
.neto>div:nth-child(1){background:linear-gradient(135deg,color-mix(in srgb,#5B7CFA 22%,var(--surface)),var(--surface))}
.neto>div:nth-child(2){background:linear-gradient(135deg,color-mix(in srgb,#E0567A 22%,var(--surface)),var(--surface))}
.neto>div.neto-q{background:linear-gradient(135deg,color-mix(in srgb,#2FBF80 26%,var(--surface)),var(--surface));border-color:color-mix(in srgb,#2FBF80 40%,transparent)}
.neto b{font-size:17px}
/* Efectivo / Transfer. / Anotado como mosaicos */
.split{gap:8px;padding:0 14px 14px;border-top:0}
.split>div{border:1px solid var(--bd);border-radius:14px;background:var(--surface-2);padding:10px 11px}
.split>div+div{border-left:1px solid var(--bd)}
.split>div:nth-child(1){background:linear-gradient(160deg,color-mix(in srgb,var(--cash) 16%,var(--surface)),var(--surface))}
.split>div:nth-child(2){background:linear-gradient(160deg,color-mix(in srgb,var(--transfer) 16%,var(--surface)),var(--surface))}
.split>div:nth-child(3){background:linear-gradient(160deg,color-mix(in srgb,var(--due) 16%,var(--surface)),var(--surface))}

/* accesos rápidos como grilla de botones */
.tools-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:0}.tools-row .nt-open{flex:0 0 calc((100% - 16px)/3)}
.tools-row .nt-open,.wb-act .nt-open{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;padding:9px 4px 8px;font-size:12.5px;line-height:1.15;text-align:center;background:var(--card-grad);border:1px solid var(--bd);box-shadow:var(--shadow);position:relative;min-width:0}
.tools-row .nt-open svg,.wb-act .nt-open svg{width:21px;height:21px;color:var(--accent);flex:none}
.tools-row .nt-open small,.tools-row .nt-open .badge-in,.wb-act .nt-open small,.wb-act .nt-open .badge-in{position:absolute;top:5px;right:6px}
.wb-act{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;align-items:stretch}
.wb-act .linkbtn{align-self:center;justify-self:center;font-size:13px}
.who-bar{justify-items:center;text-align:center;grid-template-columns:minmax(0,1fr);justify-content:stretch}.who-bar>span:first-child{justify-self:center}
.wb-act{max-width:420px;margin-inline:auto;justify-self:stretch;width:100%}.who-bar>span:first-child{width:100%;text-align:center}
.wb-act .linkbtn{grid-row:2}.wb-act .linkbtn[data-rename]{grid-column:1/3;justify-self:end;margin-right:14px}.wb-act .linkbtn[data-logout]{grid-column:3;justify-self:start}
.wb-act .nt-open{width:100%}
.wb-act .linkbtn{justify-self:start;padding:4px 2px}
.who-bar{display:grid;gap:10px}

/* ranking: podio oro, plata, bronce */
.list>.rk-row:nth-child(1){background:linear-gradient(90deg,rgba(232,185,58,.22),transparent 75%)}
.list>.rk-row:nth-child(2){background:linear-gradient(90deg,rgba(190,196,214,.18),transparent 75%)}
.list>.rk-row:nth-child(3){background:linear-gradient(90deg,rgba(205,127,70,.2),transparent 75%)}
.rk-pos.top{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:#1b1030;font-size:16px}
.list>.rk-row:nth-child(1) .rk-pos.top{background:linear-gradient(135deg,#F7D774,#D9A72E)}
.list>.rk-row:nth-child(2) .rk-pos.top{background:linear-gradient(135deg,#E9ECF4,#AEB4C6)}
.list>.rk-row:nth-child(3) .rk-pos.top{background:linear-gradient(135deg,#F0B184,#B8743F)}
.rk-row.me{box-shadow:inset 3px 0 0 var(--accent)}

/* pastillas de estado más llenas */
.pill{padding:3px 10px;border-radius:8px}
.p-due{background:color-mix(in srgb,var(--due) 22%,transparent)!important;color:var(--due)!important}
.p-transfer{background:color-mix(in srgb,var(--transfer) 22%,transparent)!important}
.p-fijo{background:color-mix(in srgb,var(--accent) 22%,transparent)!important}

/* pestaña activa rellena, como en el modelo */
nav.tabs button[aria-selected="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 34%,transparent),color-mix(in srgb,var(--accent-2) 22%,transparent));color:#fff}
:root[data-theme="light"] nav.tabs button[aria-selected="true"]{color:var(--accent)}



/* deliverys disponibles (captura) */
.disp{position:fixed;inset:0;z-index:90;overflow:auto;background:radial-gradient(120% 70% at 50% 0%,#4B2A86 0%,#24123F 55%,#140A24 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 36px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.disp-in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1}
.disp-brand{display:flex;align-items:center;gap:10px;font-size:20px;letter-spacing:.3px}
.disp-brand img{width:44px;height:44px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.disp-n{font-size:120px;font-weight:800;line-height:1;margin-top:34px;background:linear-gradient(180deg,#fff,#CDB8F5);-webkit-background-clip:text;background-clip:text;color:transparent}
.disp-t{font-size:22px;font-weight:600;margin-top:6px;color:#E6DCFA}
.disp-grid{display:flex;flex-wrap:wrap;justify-content:center;row-gap:18px;width:100%;margin-top:34px}
.disp-grid>.disp-p{width:33.33%}
.disp-grid.sm{row-gap:14px}.disp-grid.sm>.disp-p{width:25%}
.disp-p{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.disp-p .av{width:64px;height:64px;font-size:22px;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 0 4px rgba(124,224,160,.18)}
.disp-grid.sm .av{width:52px;height:52px;font-size:18px}
.disp-p span{font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disp-0{margin-top:30px;color:#CBBDE8}
.disp-f{margin-top:auto;padding-top:30px;font-size:13px;color:#B9A8DC;text-transform:none}
.disp-ctl{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px}
.disp-ctl .seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px}
.disp-ctl .seg button{border:0;background:none;color:#E6DCFA;font:inherit;font-weight:600;padding:9px 16px;border-radius:999px}
.disp-ctl .seg button.on{background:#fff;color:#2A1550}
.disp-x{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;font:inherit;padding:9px 22px;border-radius:999px}
.disp-ctl small{color:#B9A8DC;font-size:12px}
.disp.clean .disp-ctl{display:none}

/* equipo: foto al lado del nombre y botones debajo */
.team-row{flex-direction:column;align-items:stretch}
.team-row .who b.tm-n{display:flex;align-items:center;gap:10px;font-size:16px}
.tm-n .av{width:42px;height:42px;font-size:15px}
.team-row .team-act{justify-content:flex-start}

/* cumpleaños con foto */
.cumple-mes .cm-n{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.cumple-mes .cm-n .av{width:30px;height:30px;font-size:11px}
.cumple-mes .hoy .cm-n .av{box-shadow:0 0 0 2px #e0679a}
.ch-av{position:relative;flex:none}.ch-av .av{width:52px;height:52px;font-size:17px;box-shadow:0 0 0 3px #e0679a}
.ch-av i{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#e0679a;color:#fff;display:grid;place-items:center}.ch-av i svg{width:14px;height:14px}

.disp-p em{font-style:normal;font-size:11.5px;font-weight:700;color:#E8C46A;margin-top:-4px;letter-spacing:.2px}
.disp-p.jefe .av{border-color:#E8C46A;box-shadow:0 0 0 4px rgba(232,196,106,.22)}

.hdr-right .sync.is-fecha{font-size:12px;font-weight:600;color:#DCD0F2;opacity:1}

/* pedidos programados */
.prog-box{border:1px solid color-mix(in srgb,#5AA9F0 45%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,#5AA9F0 10%,var(--surface)),var(--surface));border-radius:20px;padding:14px 16px;display:grid;gap:10px}
.prog-box .cm-h{display:flex;align-items:center;gap:8px}.prog-box .cm-h svg{width:20px;height:20px;color:#7DBBF5}.prog-box .cm-h b{flex:1;font-size:16px}
.pg-list{display:grid;gap:8px}
.pg-it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line)}
.pg-h{font-weight:800;font-size:18px;display:grid;line-height:1.1}.pg-h small{font-size:11px;font-weight:600;color:var(--muted)}
.pg-n{min-width:0;display:grid}.pg-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pg-n small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pg-r{display:grid;justify-items:end;gap:4px}.pg-r small{font-size:12px;color:var(--muted);white-space:nowrap}
.pg-ed{display:flex;gap:10px}.pg-bt{display:flex;gap:6px}
.pg-it.soon{border-color:#E8B93A}.pg-it.soon .pg-f{color:#E8B93A;font-weight:700}
.pg-it.late{border-color:#E0675A;background:color-mix(in srgb,#E0675A 10%,transparent)}.pg-it.late .pg-f{color:#F08A7E;font-weight:700}
.pg-it.done{opacity:.55}
.pg-vacio,.pg-man{margin:0;font-size:13px;color:var(--muted)}
.pg-dh{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}.pg-o{align-self:center;font-size:13px;color:var(--muted)}
.pg-sheet select,.pg-sheet input[type=date],.pg-sheet input[type=time]{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg);color:var(--ink);font:inherit;min-height:46px}
.pg-alert{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:120;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;padding:14px;border-radius:18px;background:#1E3A5F;color:#fff;border:1px solid #5AA9F0;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pgIn .3s ease}
.pga-ic{width:40px;height:40px;border-radius:50%;background:#5AA9F0;display:grid;place-items:center;color:#0B1E33}.pga-ic svg{width:22px;height:22px}
.pga-t{display:grid;gap:2px;min-width:0}.pga-t small{color:#BFDDF8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.pga-t b{font-size:17px}.pga-t span{font-size:13px;color:#DCEBFA}
.pga-b{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
@keyframes pgIn{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}

.pg-it{grid-template-columns:auto minmax(0,1fr);row-gap:8px}
.pg-r{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.pg-n b{white-space:normal}

/* cobrar con QR */
.qr-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--ink);font:inherit}
.qr-btn svg{width:30px;height:30px;color:var(--accent);flex:none}.qr-btn span{display:grid}.qr-btn small{color:var(--muted);font-size:12.5px}
.qr-full{position:fixed;inset:0;z-index:90;overflow:auto;background:#F4F1FA;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);gap:14px}
.qr-card{width:100%;max-width:420px;background:#fff;color:#1A1033;border-radius:24px;padding:18px 18px 16px;display:grid;justify-items:center;gap:10px;box-shadow:0 10px 30px rgba(40,20,80,.12)}
.qr-top{display:flex;align-items:center;gap:8px;font-size:15px}.qr-top img{width:28px;height:28px;border-radius:8px}
.qr-m{display:grid;justify-items:center}.qr-m small{color:#6B5E85;font-size:13px}.qr-m b{font-size:40px;font-weight:800;line-height:1.05;color:#2A1550}
.qr-img{width:100%;display:grid;place-items:center}.qr-img img{width:100%;max-width:340px;height:auto;image-rendering:pixelated;border-radius:8px}
.qr-tit{font-weight:700;font-size:14px;text-align:center}.qr-ins{margin:0;color:#6B5E85;font-size:13px;text-align:center}
.qr-act{width:100%;max-width:420px;display:grid;gap:8px}.qr-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qr-full .ghost{background:#fff;color:#2A1550;border-color:#D9D0EA}
.qr-prev{display:grid;place-items:center;background:#fff;border-radius:16px;padding:12px}.qr-prev img{max-width:260px;width:100%;image-rendering:pixelated}
.qr-empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:10px 6px}.qr-empty svg{width:40px;height:40px;color:var(--accent)}.qr-empty span{color:var(--muted);font-size:14px}

.qr-pill{border:0;font:inherit;font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.qr-res{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1px solid color-mix(in srgb,#E8B93A 45%,var(--line));background:color-mix(in srgb,#E8B93A 8%,var(--surface))}
.qr-res.all{border-color:color-mix(in srgb,var(--cash) 45%,var(--line));background:color-mix(in srgb,var(--cash) 8%,var(--surface))}
.qr-res svg{width:26px;height:26px;flex:none;color:var(--accent)}.qr-res span{display:grid}.qr-res small{color:var(--muted);font-size:12.5px}

.rk-prev{border-radius:18px;overflow:hidden;border:1px solid var(--line);max-height:52vh;overflow-y:auto}.rk-prev img{width:100%;display:block}
.rk-per{flex-wrap:wrap}.rk-sh{display:flex;align-items:center;justify-content:center;gap:8px}.rk-sh svg{width:18px;height:18px}

.paid-w{display:grid;justify-items:end;gap:2px}.paid-w small{color:var(--muted);font-size:11.5px}

.fd-ch{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.fijo-dia{display:grid;gap:8px}

.fc-box{display:grid;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}.fc-h{display:flex;gap:8px;align-items:center}.fc-h svg{width:20px;height:20px;color:var(--accent)}
.fc-box small{color:var(--muted);font-size:12.5px;line-height:1.35}.fc-res{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ink) 5%,transparent);font-weight:700}
.fc-res b{font-size:20px}.fc-res.due b{color:var(--due)}.fc-res.cash b{color:var(--cash)}.fc-box .linkbtn{justify-self:start}

.fc-l{display:flex;justify-content:space-between;font-size:14px}.fc-l.sm{font-size:13px;color:var(--muted)}

/* tarjeta de cumpleaños */
.cumcard{background:radial-gradient(110% 60% at 50% 0%,#7A2E6E 0%,#3A1650 45%,#160A26 100%)}
.cc-conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}.cc-conf i{position:absolute;border-radius:2px}
.cumcard .disp-in,.cumcard .disp-ctl{position:relative;z-index:2}
.cc-kick{margin-top:30px;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#F6C9DF;font-weight:700}
.cc-av{position:relative;margin-top:22px}.cc-av .av{width:210px;height:210px;font-size:64px;border:5px solid #fff;box-shadow:0 0 0 8px rgba(240,138,184,.45),0 20px 50px rgba(0,0,0,.45)}
.cc-cake{position:absolute;right:6px;bottom:6px;width:58px;height:58px;border-radius:50%;background:#F08AB8;color:#fff;display:grid;place-items:center;border:4px solid #2A1240}.cc-cake svg{width:30px;height:30px}
.cc-t{margin-top:22px;font-family:var(--display);font-size:clamp(40px,13vw,56px);line-height:.98;font-weight:800;background:linear-gradient(180deg,#fff,#F6C9DF);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.01em}
.cc-n{margin-top:14px;font-size:30px;font-weight:800}
.cc-f{margin-top:8px;padding:5px 16px;border-radius:999px;background:rgba(232,196,106,.18);color:#E8C46A;font-weight:700;font-size:15px}
.cc-msg{margin:18px 6px 0;font-size:18px;line-height:1.45;color:#F3E8FA;max-width:360px}
.cc-sig{margin-top:14px;font-size:14px;color:#E3B7D3;font-style:italic}
.cc-seg{flex-wrap:wrap;justify-content:center}.cc-seg button{padding:8px 12px!important;font-size:13px}
.ch-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.cc-row{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%}.cc-foto{display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}.cc-foto svg{width:18px;height:18px}
.cc-av img.av{object-fit:cover;image-rendering:auto}

.ac-pg{display:grid;gap:6px;margin-top:10px}.ac-pg label{font-size:13px;font-weight:700;color:var(--muted)}.ac-pg-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.ac-pg-row .primary{padding:12px 14px;min-height:0}

/* entregas por día */
.dc-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}.dc-sum span{display:grid;font-size:11.5px;color:var(--muted);text-align:center;background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:12px;padding:8px 4px}.dc-sum b{font-size:22px;color:var(--ink)}
.dc-list{display:grid;gap:4px;max-height:360px;overflow-y:auto}
.dc-row{display:grid;grid-template-columns:86px 1fr 40px;gap:10px;align-items:center;background:none;border:0;color:var(--ink);font:inherit;padding:6px 2px;text-align:left}
.dc-d{font-size:13.5px;font-weight:600}.dc-d small{color:var(--muted);font-weight:500}
.dc-b{height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 6%,transparent);overflow:hidden}.dc-b i{display:block;height:100%;border-radius:999px;background:color-mix(in srgb,var(--accent) 70%,transparent)}
.dc-row.top .dc-b i{background:#E8C46A}.dc-row b{text-align:right;font-size:16px}

/* barra del delivery: 4 accesos en una fila */
.wb-act{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.wb-act .nt-open{font-size:11.5px;padding-left:2px;padding-right:2px}
.wb-act .linkbtn[data-rename]{grid-column:1/4}.wb-act .linkbtn[data-logout]{grid-column:4/6}
/* ahorro */
.ah-big{display:grid;justify-items:center;gap:4px;padding:18px 14px;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--cash) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--cash) 40%,var(--line))}
.ah-big small{color:var(--muted);font-size:13px}.ah-big>b{font-size:40px;font-weight:800;color:var(--cash)}
.ah-meta{width:100%;display:grid;gap:6px;margin-top:6px}.ah-bar{height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}.ah-bar i{display:block;height:100%;background:var(--cash);border-radius:999px}.ah-meta span{font-size:12.5px;color:var(--muted);text-align:center}
.ah-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ah-stats span{display:grid;text-align:center;font-size:11.5px;color:var(--muted);padding:8px;border-radius:12px;background:color-mix(in srgb,var(--ink) 4%,transparent)}.ah-stats b{font-size:17px;color:var(--ink)}
.ah-seg{display:grid;grid-template-columns:1fr 1fr}.ah-nota{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg);color:var(--ink);font:inherit}
.ah-metabox summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}.ah-mrow{display:grid;gap:8px;margin-top:8px}.ah-mrow input#ah-mn{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg);color:var(--ink);font:inherit}

.acc-box{display:grid;gap:4px;padding:14px;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 4%,transparent)}.acc-box small{color:var(--muted);font-size:12.5px}.acc-box b{font-size:17px;word-break:break-all}.acc-box .linkbtn{justify-self:start}

.lg-forgot{font-size:15px;border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}

.tm-more{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-top:6px;border-top:1px dashed var(--line)}.tm-mas{border-style:dashed}

.ext-m{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.ext-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ext-sum span{display:grid;text-align:center;font-size:11.5px;color:var(--muted);padding:8px 4px;border-radius:12px;background:color-mix(in srgb,var(--ink) 4%,transparent)}.ext-sum b{font-size:17px;color:var(--ink)}
.ext-vias{display:grid;gap:6px}.ext-vias div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}.ext-vias span{color:var(--muted)}
.ext-txt{white-space:pre-wrap;font:inherit;font-size:13.5px;line-height:1.45;margin:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);max-height:40vh;overflow:auto}

.bv{display:grid;justify-items:center;text-align:center;gap:12px;padding-top:26px}
.bv-hi{font-size:24px;font-weight:800;display:grid;gap:4px}.bv-hi small{font-size:14px;font-weight:500;color:var(--muted)}
.bv-ic{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--accent)}.bv-ic svg{width:42px;height:42px}
.bv-t{font-size:21px}.bv-d{margin:0;color:var(--muted);font-size:15.5px;line-height:1.5;max-width:340px}.bv-d b{color:var(--ink)}
.bv-dots{display:flex;gap:6px}.bv-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.bv-dots i.on{background:var(--accent);width:22px;border-radius:999px}
.bv .qr-row{width:100%}

.rs-big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rs-big span{display:grid;text-align:center;font-size:11.5px;color:var(--muted);padding:10px 4px;border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid var(--line)}.rs-big b{font-size:19px;color:var(--ink)}
.rs-por{display:flex;flex-wrap:wrap;gap:6px}.rs-por span{font-size:12.5px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.rs-it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}.rs-it:first-child{border-top:0}
.rs-ic svg{width:20px;height:20px;color:var(--muted)}.rs-t{display:grid;font-size:14px}.rs-t small{color:var(--muted);font-size:12px}
.rs-it.ok b{color:var(--muted)}.rs-it.warn b{color:#E8B93A}.rs-it.bad b{color:var(--due)}

.bkp-box{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:start;padding:14px 16px;border-radius:20px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.bkp-box>svg{width:24px;height:24px;color:var(--accent);margin-top:2px}.bkp-box span{display:grid;gap:3px}.bkp-box small{color:var(--muted);font-size:13px;line-height:1.4}
.bkp-act{grid-column:1/-1;display:flex;gap:14px;align-items:center}

/* Más del día */
.mas-dia{border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden}
.mas-dia>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}.mas-dia>summary::-webkit-details-marker{display:none}
.mas-dia>summary>span:first-child{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}.mas-dia summary svg{width:20px;height:20px;color:var(--accent);grid-row:span 2}
.mas-dia summary small{color:var(--muted);font-size:12.5px}.mas-dia[open] .caja-arr{transform:rotate(180deg)}
.mas-in{display:grid;gap:12px;padding:0 12px 12px}.mas-in:empty{display:none}

.qr-act .field label{font-weight:700}.qr-act .money{background:#fff;border-color:#D9D0EA}.qr-act .money input{color:#1A1033}.qr-act .money span{color:#6B5E85}

.wa-sm{display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;background:#25D366;color:#06311A!important;font-weight:700;text-decoration:none;font-size:13px}

.disp-k{margin-top:26px;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#CDB8F5;font-weight:700}.disp-k+.disp-n{margin-top:6px}
.disp-seg{flex-wrap:wrap;justify-content:center;border-radius:22px}
.gen-it{align-items:center}.gen-n{display:flex;align-items:center;gap:10px}.gen-n .av{width:34px;height:34px;font-size:12px}.gen-b{display:flex;gap:6px}

.nav-back{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:15px;padding:6px 8px 6px 0;margin-right:auto;cursor:pointer;white-space:nowrap}
.sheet-h .nav-back{order:-1}.sheet-h:has(.nav-back){display:flex;align-items:center;gap:8px}.sheet-h:has(.nav-back) h3{flex:1;font-size:18px}
.nav-row{display:flex}

.tab-back{display:block;justify-self:start;align-self:start;text-align:left;margin:0 auto 4px 0;padding:8px 2px}

/* letra grande */
html[data-letra="g"] body{zoom:1.12}html[data-letra="xg"] body{zoom:1.25}
/* repetir */
.rep-row{display:grid;gap:6px}.rep-l{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}.rep-l svg{width:16px;height:16px}.rep-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.rep-chips .chip{white-space:nowrap;flex:none}
/* buscar */
.hdr-search{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;margin-left:auto;margin-right:10px}.hdr-search svg{width:20px;height:20px}
.bus-q{display:flex}.bus-it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;padding:11px 14px}.list .bus-it:first-child{border-top:0}
.bus-it span{display:grid;flex:1;min-width:0}.bus-it small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bus-it .av{width:30px;height:30px;font-size:11px}
/* tiempo */
.tm-big{display:grid;justify-items:center;padding:6px 0 4px}.tm-big b{font-size:34px;font-weight:800}.tm-big small{color:var(--muted);font-size:12.5px;text-align:center}

/* pantalla simple del delivery */
.dv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 4px}
.dv-top>span{display:grid;line-height:1.2}.dv-top small{color:var(--muted);font-size:13.5px}.dv-top>span>b{font-size:22px}
.dv-top em{font-style:normal;font-size:13px;color:var(--muted)}
.dv-mas{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:10px 16px;font:inherit;font-size:15px;font-weight:700;position:relative}
.dv-mas .badge-in{position:absolute;top:-7px;right:-7px}
.dv-acc{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:9px}
.dv-acc>button{display:grid;justify-items:start;align-content:start;gap:3px;border-radius:18px;padding:13px 11px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;text-align:left;box-shadow:var(--shadow);min-height:108px;min-width:0}
.dv-acc>button .ic{width:24px;height:24px;color:var(--accent);margin-bottom:4px}
.dv-acc>button>span{font-weight:700;font-size:15px;line-height:1.15}.dv-acc>button>b{font-size:17px;white-space:nowrap}.dv-acc>button>small{color:var(--muted);font-size:12.5px;line-height:1.2}
.dv-acc>.dv-new{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:0;padding:18px;border:0;color:#fff;background:linear-gradient(135deg,#a779ff,#7c4dff);box-shadow:0 8px 22px rgba(124,77,255,.35)}
.dv-acc>.dv-new .ic{color:#fff;width:26px;height:26px;margin:0;stroke-width:2.6}.dv-acc>.dv-new span{font-size:20px;font-weight:800}
.dv-pay{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid var(--line)}
.dv-pay>span{display:grid;gap:2px;font-weight:600}.dv-pay small{color:var(--muted);font-weight:400;font-size:13px}.dv-pay>b{font-size:22px}
.dv-det{margin-top:10px}.dv-det>summary{list-style:none;display:flex;justify-content:center;gap:6px;cursor:pointer;color:var(--accent);font-weight:700;font-size:15px;padding:8px}
.dv-det>summary::-webkit-details-marker{display:none}.dv-det[open]>summary .caja-arr{transform:rotate(180deg)}
.dv-det>*:not(summary){margin-top:12px}
.dv-nov{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.dv-nov>.ic{width:22px;height:22px;color:var(--accent);flex:none}.dv-nov>span{display:grid;gap:2px;flex:1}.dv-nov small{color:var(--muted);font-size:13px}.dv-nov .linkbtn{flex:none}
.dvm-list{display:grid}.dvm-it{display:flex;align-items:center;gap:14px;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit;text-align:left}
.dvm-it .ic{width:22px;height:22px;color:var(--accent);flex:none}.dvm-it>span:nth-child(2){display:grid;flex:1}.dvm-it b{font-size:16px}.dvm-it small{color:var(--muted);font-size:13px}
</style>

function stats(list){

    const p=pctOf(d._u);s.pcts.add(p);s.com+=d.valor*p/100;if(d.metodo==="anotado"){if(d.conf==="pend"){s.anotPend+=d.valor;s.nPend++}else if(d.conf==="no")s.anotNo+=d.valor;else if(p)s.anotCom+=d.valor}}

function pendientes(from,to){

async function progOk(id,on,quiet){const mine=(rank.get(S.me)||{}).progOk||{};const o={};const ks=Object.entries(mine).sort((a,b)=>b[1]-a[1]).slice(0,60);for(const[k,v]of ks)o[k]=v;

function progBeep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=window.__pgAC||(window.__pgAC=new A());if(c.state==="suspended")c.resume();
  [0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.2);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)})}catch(e){}

/* recorta solo el QR de un print de la app del banco (busca el bloque cuadrado con muchos cambios blanco/negro) */
async function qrRecortar(file){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
  const sc=Math.min(1,900/Math.max(img.width,img.height));const W=Math.round(img.width*sc),H=Math.round(img.height*sc);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
  const px=x.getImageData(0,0,W,H).data;const C=12,cw=Math.floor(W/C),ch=Math.floor(H/C);const busy=new Uint8Array(cw*ch);
  for(let cy=0;cy<ch;cy++)for(let cx=0;cx<cw;cx++){let dk=0;for(let j=cy*C;j<cy*C+C;j++)for(let i=cx*C;i<cx*C+C;i++){const k=(j*W+i)*4;if(px[k]*.3+px[k+1]*.59+px[k+2]*.11<128)dk++}const f=dk/(C*C);busy[cy*cw+cx]=f>.12&&f<.88?1:0}
  const seen=new Uint8Array(cw*ch);let best=null;
  for(let y=0;y<ch;y++)for(let x0=0;x0<cw;x0++){if(!busy[y*cw+x0]||seen[y*cw+x0])continue;const st=[[x0,y]];seen[y*cw+x0]=1;let n=0,x1=x0,x2=x0,y1=y,y2=y;
    while(st.length){const[a,b]=st.pop();n++;if(a<x1)x1=a;if(a>x2)x2=a;if(b<y1)y1=b;if(b>y2)y2=b;
      for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){const u=a+dx,v=b+dy;if(u>=0&&u<cw&&v>=0&&v<ch&&busy[v*cw+u]&&!seen[v*cw+u]){seen[v*cw+u]=1;st.push([u,v])}}}
    const w=x2-x1+1,h=y2-y1+1,fill=n/(w*h),asp=Math.min(w,h)/Math.max(w,h);if(asp<.6||fill<.45||w<6)continue;const sc2=n*asp*fill;if(!best||sc2>best.s)best={s:sc2,a:x1*C,b:y1*C,c:(x2+1)*C,d:(y2+1)*C}}
  let crop=null;if(best){const w=best.c-best.a,h=best.d-best.b;if(w>W*.15){const pad=Math.round(Math.max(w,h)*.07);crop=[Math.max(0,best.a-pad),Math.max(0,best.b-pad),Math.min(W,best.c+pad),Math.min(H,best.d+pad)]}}
  const [a,b,c,d]=crop||[0,0,W,H];const side=Math.min(720,Math.max(c-a,d-b));const k=side/Math.max(c-a,d-b);
  const o=document.createElement("canvas");o.width=Math.round((c-a)*k);o.height=Math.round((d-b)*k);const ox=o.getContext("2d");ox.imageSmoothingEnabled=!crop;ox.fillStyle="#fff";ox.fillRect(0,0,o.width,o.height);ox.drawImage(cv,a,b,c-a,d-b,0,0,o.width,o.height);
  let out=o.toDataURL("image/png");if(out.length>350000)out=o.toDataURL("image/jpeg",.85);return{img:out,auto:!!crop}}finally{URL.revokeObjectURL(url)}}
function qrPick(){let inp=document.getElementById("qr-file");if(!inp){inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.id="qr-file";inp.hidden=true;document.body.appendChild(inp);
  inp.addEventListener("change",async()=>{const f=inp.files&&inp.files[0];inp.value="";if(!f)return;toast("Preparando el QR…");try{const r=await qrRecortar(f);QRIMG=r;openQRPrev()}catch(e){toast("No se pudo leer la imagen")}})}inp.click()}

function resumenDia(){const t=today();const it=allItems().filter(([,d])=>d.dia===t);const fin=it.filter(([,d])=>!isCamino(d));const s=stats(fin);
  const cam=it.filter(([,d])=>isCamino(d)).length;const dels=activos().filter(u=>u!==S.me&&!roles.socios.includes(u));
  const porU=dels.map(u=>({u,n:stats(fin.filter(([,d])=>d._u===u)).n})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  let trab=0;for(const u of dels){try{if(estadoDe(u).cls==="cz-work")trab++}catch(e){}}
  const abiertas=[],faltas=[];for(const u of dels){const c=cajaOf(u,t);if(!c)continue;if(c.cierraEm){const dif=(c.cierra||0)-(c.esp||0);if(dif<0)faltas.push({u,v:-dif})}else if(c.abreEm&&!c.auto||fin.some(([,d])=>d._u===u))abiertas.push(u)}
  const sinCerrar=dels.filter(u=>fin.some(([,d])=>d._u===u)&&!(cajaOf(u,t)||{}).cierraEm);
  const cf=confList();const cfV=cf.reduce((a,[,d])=>a+(d.valor||0),0);
  const deben=dels.map(u=>({u,v:cuentaDe(u).saldo})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);const debT=deben.reduce((a,x)=>a+x.v,0);
  let prog=[];try{prog=progAll().filter(x=>!x.hecho&&x.dia===t)}catch(e){}
  return{s,cam,porU,trab,sinCerrar,faltas,cf,cfV,deben,debT,prog}}

var QREMP=null,QRE_IMG=null;
async function qrAchicar(img){if(img.length<=150000)return img;const im=await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src=img});const k=480/Math.max(im.width,im.height);
  const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);let d=c.toDataURL("image/png");if(d.length>150000)d=c.toDataURL("image/jpeg",.8);return d}

/* ---------- Repetir una entrega: las últimas distintas del que registra, para cargar con un toque ---------- */
function repetibles(){const u=writeTarget();const seen=new Set(),out=[];
  for(const[,d]of allItems().filter(([,d])=>d._u===u&&!isCamino(d)&&!d.diario&&d.metodo!=="fijo"&&(d.cliente||"").trim()).sort((a,b)=>(b[1].criadoEm||0)-(a[1].criadoEm||0))){
    const k=norm(d.cliente)+"|"+d.metodo+"|"+d.valor;if(seen.has(k))continue;seen.add(k);out.push(d);if(out.length>=4)break}return out}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("button[data-rep]");if(!t)return;const d=repetibles()[+t.dataset.rep];if(!d)return;
  S.cliente=d.cliente||"";S.val=d.valor||0;S.metodo=d.metodo;S.obs=d.obs||"";S.prod=d.producto||0;S.err="";
  document.querySelectorAll("[data-metodo]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.metodo===S.metodo));refreshForm();
  {const c=document.getElementById("cli");if(c)c.value=S.cliente;const o=document.getElementById("obs");if(o)o.value=S.obs;const v=document.getElementById("val");if(v)v.value=fmtInput(S.val)}
  document.querySelectorAll("[data-rep]").forEach(b=>b.classList.toggle("on",b===t));toast("Listo · revisá y tocá Registrar")});
