/* ---------- Tiempo de entrega: desde que se anota/pasa el pedido hasta "Entregado" ---------- */
function tiempos(list){const r=[];for(const[,d]of list){if(!d.t0||!d.criadoEm||isCamino(d))continue;const m=Math.round((d.criadoEm-d.t0)/60000);if(m<1||m>360)continue;r.push({u:d._u,m})}return r}
function tiemposBlock(list){if(S.mode==="db"&&!S.owner){const t=tiempos(list.filter(([,d])=>d._u===S.me));if(!t.length)return"";const av=Math.round(t.reduce((a,x)=>a+x.m,0)/t.length);
    return `<section class="sec"><div class="sec-h"><h2>Tu tiempo de entrega</h2><span>${plural(t.length,"pedido")}</span></div><div class="tm-big"><b class="num">${av} min</b><small>en promedio desde que tomás el pedido hasta entregarlo</small></div></section>`}
  const t=tiempos(list);if(!t.length)return `<section class="sec"><div class="sec-h"><h2>Tiempo de entrega</h2></div><p class="hint" style="margin:0">Se mide en los pedidos que pasan por “En camino” (Anotar pedido o Pasar pedido) hasta que tocan Entregado. Aparece acá cuando haya datos.</p></section>`;
  const av=Math.round(t.reduce((a,x)=>a+x.m,0)/t.length),lent=t.filter(x=>x.m>40).length;const by=new Map();for(const x of t){if(!by.has(x.u))by.set(x.u,[]);by.get(x.u).push(x.m)}
  const rows=[...by.entries()].map(([u,a])=>({u,n:a.length,av:Math.round(a.reduce((s,v)=>s+v,0)/a.length),l:a.filter(v=>v>40).length})).sort((a,b)=>a.av-b.av);const mx=Math.max(...rows.map(r=>r.av),1);
  return `<section class="sec"><div class="sec-h"><h2>Tiempo de entrega</h2><span>${plural(t.length,"pedido")}</span></div>
    <div class="tm-big"><b class="num">${av} min</b><small>promedio del equipo${lent?` · <span class="c-due">${plural(lent,"pedido")} de más de 40 min</span>`:""}</small></div>
    <div class="list">${rows.map((r,i)=>`<div class="rk-row"><span class="rk-pos ${i===0?"top":""}">${i+1}º</span><div class="rk-main"><div class="rk-name">${avatarHtml(personName(r.u),r.u)}<b>${esc((personName(r.u)||"").split(" ")[0])}</b></div><span class="rk-bar"><i style="width:${(r.av/mx*100).toFixed(1)}%"></i></span></div><span class="rk-n num">${r.av} min<small>${plural(r.n,"pedido")}${r.l?" · "+r.l+" lentos":""}</small></span></div>`).join("")}</div>
    <p class="hint" style="margin:0">Desde que se anota o se pasa el pedido hasta que el delivery toca Entregado. El 1º es el más rápido.</p></section>`}

  try{const c=JSON.parse(localStorage.getItem(LSW)||"null");if(c&&Date.now()-c.at<30*60000&&c.d&&c.d.daily&&c.d.daily.time&&c.d.daily.time[0]===today()){CLIMA=c.d;climaAt=c.at;return}}catch(e){}
  climaBusy=true;
  fetch("https://api.open-meteo.com/v1/forecast?latitude=-25.79&longitude=-55.08&current=temperature_2m,weather_code,precipitation&hourly=precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FAsuncion&forecast_days=1")
    .then(r=>r.ok?r.json():null).then(d=>{if(d&&d.current){CLIMA=d;climaAt=Date.now();try{localStorage.setItem(LSW,JSON.stringify({at:climaAt,d}))}catch(e){}render()}}).catch(()=>{}).finally(()=>{climaBusy=false})}
const wIcon=c=>c<=1?"☀️":c===2?"⛅":c===3?"☁️":c<=48?"🌫️":c<=67?"🌧️":c<=77?"❄️":c<=82?"🌦️":"⛈️";
const esLluvia=c=>(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;
function climaHtml(){if(S.dia!==today()||!CLIMA||!CLIMA.current)return"";const cu=CLIMA.current,dl=CLIMA.daily||{},h=CLIMA.hourly||{};
  const tNow=Math.round(cu.temperature_2m),code=cu.weather_code,mx=Math.round((dl.temperature_2m_max||[])[0]),mn=Math.round((dl.temperature_2m_min||[])[0]);
  const hr=new Date().getHours();let rainAt=null,tormenta=code>=95,pRain=0;
  (h.time||[]).forEach((t,i)=>{const H=Number(String(t).slice(11,13));if(H<hr)return;const pr=(h.precipitation_probability||[])[i]||0,wc=(h.weather_code||[])[i]||0;if(wc>=95)tormenta=true;if(pr>pRain)pRain=pr;if(rainAt===null&&(pr>=60||esLluvia(wc)))rainAt=H});
  const lloviendo=esLluvia(code)||(cu.precipitation||0)>0.2;
  let tip,cls="ok";
  if(tormenta){tip="⛈️ Tormenta: si hay rayos, esperá bajo techo y cuidá el celular.";cls="bad"}
  else if(lloviendo){tip="🌧️ Está lloviendo: capa puesta y andá despacio, el piso resbala.";cls="bad"}
  else if(rainAt!==null){tip=`☔ Lluvia desde las ${String(rainAt).padStart(2,"0")}:00: llevá la capa de lluvia en la moto.`;cls="warn"}
  else if(mx>=33){tip=`🥵 Mucho calor (máx ${mx}°): tomá agua y protegete del sol.`;cls="warn"}
  else if(mn<=10){tip="🧥 Hace frío: abrigate bien, sobre todo a la noche.";cls="warn"}
  else tip="😎 Buen tiempo: ¡aprovechá para hacer muchas entregas!";
  return `<div class="clima ${cls}"><div class="cl-top"><span class="cl-ic">${wIcon(code)}</span><b class="num">${tNow}°</b><span class="cl-mm">Santa Rita · máx ${mx}° · mín ${mn}°${pRain>=30?` · lluvia ${pRain}%`:""}</span></div><div class="cl-tip">${tip}</div></div>`}

/* Deliverys (no dueño) no ven comisión ni liquidación: solo entregas, montos cobrados y gastos */
const hideMoney=()=>false;/* desde v90 los deliverys ven su comisión y liquidación (lo mismo que ve el dueño de ellos) */
/* Deliverys solo cambian el día de hoy y mientras no esté liquidado; el dueño cambia todo */
var CARGA_DESDE="2026-10-19",CARGA_HASTA="2026-10-26";
function lockReason(dia){if(S.mode!=="db"||S.owner)return"";
  if(dia>today())return"No se puede registrar en días que todavía no llegaron.";
  /* liberado al empezar a usar la app: hasta el lunes 26/10 se puede cargar toda la semana desde el lunes 19/10; después, solo hoy y ayer */
  const ayer=addDays(today(),-1);const libre=(today()<=CARGA_HASTA&&dia>=CARGA_DESDE)||dia===ayer;
  if(dia!==today()&&!libre)return"Solo podés registrar entregas y gastos de hoy y de ayer. Si hay que corregir otro día, pedíselo al dueño.";
  {const c=(S.people.get(S.me)||{}).cierre;if(dia===today()&&c&&c.dia===dia)return"Ya cerraste el día de hoy. Si te faltó registrar algo, pedíselo al dueño (o mañana podés cargarlo como día de ayer).";}
  if(pagoOf(S.me,dia))return"Este día ya fue liquidado. Si hay que corregir algo, pedíselo al dueño.";return""}

  if(st){const lbl=st.changed?`Pagado ${gs(st.p.monto)} · cambió`:`Pagado ✓ ${ddmm(keyOf(new Date(st.p.pagadoEm)))} ${hhmm(st.p.pagadoEm)}`;

/* ---------- caja: apertura y cierre (turnos/<uid>/caja/<dia>) ---------- */
var cajas=new Map();
const cajaOf=(u,dia)=>cajas.get(u+"|"+dia)||null;
function cajaCalc(u,dia){const l=allItems().filter(([,d])=>d._u===u&&d.dia===dia&&!isCamino(d));
  let ef=0,prod=0,prodOut=0,pago=0,diar=0,tr=0,ntr=0,emp=0,nemp=0;
  for(const[,d]of l){if(d.metodo==="efectivo"){ef+=d.valor||0;prod+=prodCobra(d)}else if(d.metodo==="pagado")pago+=d.valor||0;
    else if(d.metodo==="transferencia"){tr+=d.valor||0;ntr+=d.cant||1}
    else if(d.metodo==="anotado"){emp+=d.valor||0;nemp+=d.cant||1}
    else if(d.metodo==="fijo"&&d.diario){if(d.via==="transferencia")tr+=d.valor||0;else if(d.via==="empresa")emp+=d.valor||0;else diar+=d.valor||0}}
  const gas=[...S.gastos.values(),...(u===S.me?S.priv.values():[])].filter(g=>g._u===u&&g.dia===dia).reduce((a,g)=>a+(g.valor||0),0);
  const c=cajaOf(u,dia)||{};const ab=c.abre||0;return{ab,ef,prod,prodOut,pago,diar,gas,tr,ntr,emp,nemp,esp:ab+ef+pago+diar-gas,c}}
function cajaPuedeAbrir(u){return isRealOwner||!allItems().some(([,d])=>d._u===u&&d.dia===today()&&!isCamino(d))}
function cajaOpenPref(u,force){if(force)return true;try{const o=JSON.parse(localStorage.getItem("caixa_caja_open")||"{}");return o[u+"|"+today()]===true}catch(e){return false}}
document.addEventListener("toggle",e=>{const d=e.target;if(!d||!d.dataset||!d.dataset.cajadet)return;try{const o=JSON.parse(localStorage.getItem("caixa_caja_open")||"{}");o[d.dataset.cajadet+"|"+today()]=d.open;localStorage.setItem("caixa_caja_open",JSON.stringify(o))}catch(x){}},true);
function cajaBox(){if(S.mode!=="db"||S.dia!==today()||showEmp())return"";const u=S.filter==="all"?S.me:S.filter;const yo=u===S.me;const K=cajaCalc(u,S.dia);const c=K.c;
  const tieneEnt=allItems().some(([,d])=>d._u===u&&d.dia===today()&&!isCamino(d));
  if(!c.abreEm&&(yo?cajaPuedeAbrir(u):!tieneEnt)){{return yo?`<button type="button" class="caja-open" data-cajaabrir><span class="caja-ic">💰</span><span><b>Abrir caja</b><small>Al empezar el día, antes de la primera entrega: anotá con cuánto empezás</small></span><span class="caja-go">›</span></button>`

async function fotoComprimir(file){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});

function destacados(){const t=fromKey(today());const dow=(t.getDay()+6)%7;const lun=addDays(today(),-dow);const wFrom=addDays(lun,-7),wTo=addDays(lun,-1);
  const pm=new Date(t.getFullYear(),t.getMonth()-1,1);const mFrom=keyOf(pm),mTo=keyOf(new Date(t.getFullYear(),t.getMonth(),0));
  const best=(a,b)=>{let top=0,who=[];try{for(const[u,d]of rank){if(String(u).startsWith("_")||!d||d.nop||isBaja(u))continue;let n=0;for(const[k,v]of Object.entries(d.dias||{}))if(k>=a&&k<=b)n+=v||0;if(!n)continue;if(n>top){top=n;who=[d.nome||personName(u)||""]}else if(n===top)who.push(d.nome||personName(u)||"")}}catch(e){}return{n:top,who:who.filter(Boolean)}};
  return{sem:best(wFrom,wTo),mes:best(mFrom,mTo),mesNom:MESES[pm.getMonth()]}}

  if(t.dataset.reactivar){try{const ru=t.dataset.reactivar;if(isAux(ru)){const pp=S.people.get(ru)||{};await db.doc("turnos/"+ru).set({pideVolver:null,auxHoy:{dia:today(),nome:(pp.nome||""),em:Date.now()}},{merge:true})}await setBaja(ru,false);toast("Delivery reactivado");openEquipo()}catch(err){toast("No se guardó.")}return}
  if(t.dataset.dvia){layer.querySelectorAll("[data-dvia]").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t.dataset.dsave){const v=parseVal(document.getElementById("d-val").value);if(!v){toast("Escribí el monto del diario");return}
    const via=(layer.querySelector('[data-dvia][aria-pressed="true"]')||{dataset:{dvia:"efectivo"}}).dataset.dvia;
    const when=S.dia===today()?new Date():new Date(fromKey(S.dia).setHours(20,0,0,0));
    const pagAp=via==="empresa_pag";const d={valor:v,metodo:"fijo",diario:true,via:pagAp?"empresa":via,cliente:t.dataset.dsave,obs:pagAp?"Diario · la empresa ya le pagó":via==="empresa"?"Diario · cobra la empresa":"Diario",dia:S.dia,criadoEm:when.getTime()};if(pagAp)d.desc=0;
    const wt=writeTarget(),eid=uid();if(via==="empresa")fijoCalc(wt,d,eid);
    if(false&&via==="empresa"&&db){const m={tipo:"abono",monto:v,nota:"Diario "+t.dataset.dsave+" (cobró la empresa)",em:Date.now(),abierto:true,por:S.me,ref:eid};const mid=uid();movs.set(wt+"|"+mid,{...m,_u:wt,_id:mid});sendW(db.collection("liq/"+wt+"/movs").doc(mid).set(m)).catch(()=>toast("No se guardó el descuento en la cuenta"))}
    closeSheet();try{const w=await sendW(addItem(d,wt,eid));if(w==="wait"){toast("Guardado en el celular · se envía al volver la señal")}else toast(via==="empresa_pag"?"Diario "+gs(v)+" · ya pagado, no se descuenta":via==="empresa"?"Diario "+gs(v)+" · se descuenta de lo que "+(wt===S.me?"tenés que pagar":personName(wt).split(" ")[0]+" tiene que pagar"):"Diario guardado: "+gs(v))}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="permission-denied"))noPerm();else toast("No se guardó.")}return}
  if(t.dataset.camprod){const k=t.dataset.camprod;const d=S.items.get(k);if(!d)return;const v=d.pagoTipo==="prod"?null:"prod";d.pagoTipo=v;openCamino(k);render();
    try{await sendW(patchItem(k,{pagoTipo:v}));toast(v?"Cobrar solo el delivery: "+gs(d.valor):"Vuelve a cobrar producto + delivery")}catch(err){toast("No se guardó.")}return}
  if(t.dataset.copyc){const d=S.items.get(t.dataset.copyc);if(d)copy(cuentaTxt(d.producto||0,d.valor,d.pagoTipo));return}
  if(t.dataset.entregado){const k=t.dataset.entregado,how=t.dataset.how,d=S.items.get(k);if(!d)return;
    if(how==="anotado"&&!(d.cliente||"").trim()){toast("Para anotar, el pedido necesita nombre de cliente");return}
    const r=S.mode==="db"&&!S.owner&&pagoOf(S.me,today())?"Hoy ya fue liquidado. Pedile al dueño que lo registre.":"";if(r){lockedMsg(r);return}
    if(t.dataset.pendc&&!(d.cliente||"").trim()){toast("Para cobrar después, el pedido necesita nombre de cliente");return}
    closeSheet();try{if(t.dataset.pendc)addPend(d._u,d._id,{...d,dia:today()}).catch(()=>{});const t0=(d.central&&d.central.em)||d.criadoEm||0;await patchItem(k,how==="fijo"?{estado:"ok",metodo:how,valor:0,dia:today(),criadoEm:Date.now(),t0}:{estado:"ok",metodo:how,dia:today(),criadoEm:Date.now(),t0});toast(t.dataset.pendc?"Entregado · ⏳ transferencia por cobrar":"Entrega finalizada · "+M[how].n)}catch(err){toast("No se guardó.")}return}
  if(t.dataset.cdel){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Tocá de nuevo para quitarlo";return}
    const k=t.dataset.cdel;closeSheet();try{await delItem(k);toast("Quitado de la lista")}catch(err){toast("No se eliminó.")}return}
  if(t.hasAttribute("data-nsave")){const n=document.getElementById("n-val").value.trim();if(!n){toast("Escribí tu nombre");return}closeSheet();try{await saveName(n);toast("Nombre guardado")}catch(err){noPerm()}return}
  if(t.dataset.p0){const i=document.getElementById("p-"+t.dataset.p0);const on=!t.classList.contains("on");t.classList.toggle("on",on);if(i)i.value=on?"0":"";return}
  if(t.hasAttribute("data-psave")){const g=parseVal(document.getElementById("p-gen").value);if(!g||g>=100){toast("Usá un número entre 1 y 99");return}
    const por={};let bad=false;layer.querySelectorAll("[data-pu]").forEach(i=>{const raw=i.value.trim();if(raw==="0"){por[i.dataset.pu]=0;return}const v=parseVal(raw);if(raw&&(!v||v>=100))bad=true;if(v&&v<100&&v!==g)por[i.dataset.pu]=v});
    if(bad){toast("Usá números entre 1 y 99");return}
    closeSheet();try{await saveCfg({pct:g,por});toast("Comisiones guardadas")}catch(err){toast("No se guardó.")}return}
  if(!edit)return;
  if(t.dataset.emetodo){edit.metodo=t.dataset.emetodo;edit.armed=false;drawSheet()}
  else if(t.hasAttribute("data-esave")){if(!edit.valor){toast("Escribí el monto");return}
    const p={valor:edit.valor,cant:edit.metodo==="fijo"?(edit.cant||1):1,producto:edit.producto||0,metodo:edit.metodo,cliente:edit.cliente.trim(),obs:edit.obs.trim()};
    const k=edit.key;closeSheet();
    if(needsApproval()){try{await pedirCambio(k,"editar",p);toast("Pedido de cambio enviado al dueño")}catch(err){toast("No se envió.")}return}
    try{await patchItem(k,p);toast("Entrega actualizada")}catch(err){toast("No se guardó.")}}
  else if(t.hasAttribute("data-edel")){if(!edit.armed){edit.armed=true;drawSheet();return}
    const k=edit.key;closeSheet();
    if(needsApproval()){try{await pedirCambio(k,"borrar",null);toast("Pedido para borrar enviado al dueño")}catch(err){toast("No se envió.")}return}
    try{await delItem(k);toast("Entrega eliminada")}catch(err){toast("No se eliminó.")}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer.innerHTML&&!document.getElementById("n-val"))closeSheet()});

/* ---------- Volver: al abrir una pantalla desde otra, aparece "‹ Volver" para regresar a la anterior ---------- */
var NAVSTK=[],NAVCUR=null,NAVBACK=false;
function navAddBack(){if(!layer.innerHTML.trim()||layer.querySelector("[data-navback],.nt-back,.bv,.pg-alert"))return;
  const b=`<button type="button" class="nav-back" data-navback aria-label="Volver">‹ Volver</button>`;
  const h=layer.querySelector(".sheet-h");if(h){h.insertAdjacentHTML("afterbegin",b);return}
  const c=layer.querySelector(".disp-ctl,.qr-act");if(c){c.insertAdjacentHTML("afterbegin",b.replace('class="nav-back"','class="disp-x nav-back2"'));return}
  const sh=layer.querySelector(".sheet");if(sh)sh.insertAdjacentHTML("afterbegin",`<div class="nav-row">${b}</div>`)}
function navWrap(name,fn){return function(...a){
  if(!NAVBACK){const open=!!layer.innerHTML.trim();if(!open)NAVSTK=[];else if(NAVCUR&&NAVCUR.name!==name){if(NAVSTK.length&&NAVSTK[NAVSTK.length-1].name===name)NAVSTK.pop();else NAVSTK.push(NAVCUR)}}
  NAVCUR={name,fn,args:a};const r=fn.apply(this,a);if(r&&r.then)r.then(navAddBack);else navAddBack();return r}}

/* en las otras pestañas (Anotados, Informe, Ranking…) arriba aparece "Volver al inicio" */
/* "Volver al inicio": en otra pestaña, viendo a un delivery o en otro día */
function enInicio(){return S.tab==="dia"&&S.dia===today()&&!(S.mode==="db"&&S.owner&&S.filter!=="all")}
function tabBack(){const b=document.getElementById("tab-back");if(enInicio()){if(b)b.remove();return}if(!b&&main)main.insertAdjacentHTML("afterbegin",`<button type="button" id="tab-back" class="nav-back tab-back" data-goinicio>‹ Volver al inicio</button>`)}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-goinicio]");if(!t)return;S.tab="dia";S.dia=today();if(S.mode==="db"&&S.owner)S.filter="all";closeSheet();render(true);window.scrollTo(0,0)});
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-navback]");if(!t)return;e.stopPropagation();const prev=NAVSTK.pop();if(!prev){closeSheet();return}
  NAVBACK=true;NAVCUR=prev;try{const r=prev.fn.apply(null,prev.args);if(r&&r.then)r.then(navAddBack);else navAddBack()}finally{NAVBACK=false}},true);
})();
