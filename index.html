<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#331A5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tú Delivery">
<title>Caja de Entregas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone ledger — day summary up top, quick entry, then the day's list; tabs for fiados and week */
:root{
  --bg:#F3F1F7; --surface:#FFFFFF; --ink:#1E1630; --muted:#665E75; --line:#DCD7E5;
  --accent:#331A5B; --accent-ink:#FFFFFF; --road:#331A5B;
  --cash:#1E7A4C; --transfer:#2D5FA8; --due:#B4501A;
  --cash-bg:#E3F2E9; --transfer-bg:#E5ECF7; --due-bg:#F8E8DE;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1D1726; --ink:#ECE8F3; --muted:#A49CB3; --line:#2F2740;
  --accent:#B9A2E6; --accent-ink:#1A0F2E; --road:#2A1550;
  --cash:#5FCB8F; --transfer:#86AEEB; --due:#F0935A;
  --cash-bg:#17301F; --transfer-bg:#1A2638; --due-bg:#36221A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1D1726; --ink:#ECE8F3; --muted:#A49CB3; --line:#2F2740;
  --accent:#B9A2E6; --accent-ink:#1A0F2E; --road:#2A1550;
  --cash:#5FCB8F; --transfer:#86AEEB; --due:#F0935A;
  --cash-bg:#17301F; --transfer-bg:#1A2638; --due-bg:#36221A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--road)}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--road);color:#F3F6F2;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.brand{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:22px;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand .logo{width:46px;height:38px;border-radius:7px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.brand span{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand small{font-family:var(--body);font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:#C9BEDD;margin-top:3px}
.sync{font-size:12px;color:#C9BEDD}
nav.tabs{display:flex;gap:4px;max-width:640px;margin:12px auto 0}
nav.tabs button{flex:1;background:none;border:0;color:#C9BEDD;font:600 14px var(--body);padding:10px 4px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--due);color:#fff;font-size:11px;line-height:18px}
main{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.daylabel{text-align:center;min-width:0}
.daylabel b{display:block;font-family:var(--display);font-stretch:85%;font-size:20px;font-weight:700;text-transform:capitalize}
.daylabel span{font-size:12px;color:var(--muted)}
/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sum-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 16px 12px;flex-wrap:wrap}
.sum-head .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:38px;line-height:1}
.count{text-align:right}
.count .big{font-size:30px}
.split{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.split>div{padding:10px 12px;min-width:0}
.split>div+div{border-left:1px solid var(--line)}
.split .k{font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.split .v{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .n{font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.c-cash{color:var(--cash)} .c-transfer{color:var(--transfer)} .c-due{color:var(--due)}
.d-cash{background:var(--cash)} .d-transfer{background:var(--transfer)} .d-due{background:var(--due)}
.caixa{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--cash-bg);border-top:1px solid var(--line);flex-wrap:wrap}
.caixa .t{font-size:13px;min-width:0}
.caixa .t small{display:block;color:var(--muted);font-size:12px}
.caixa .v{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:22px;color:var(--cash)}
a.linkbtn{display:inline-block}
.linkbtn{background:none;border:0;color:var(--ink);font:600 13px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
/* entry */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.entry h2,.sec h2{margin:0;font-family:var(--display);font-stretch:80%;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.money{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg)}
.money:focus-within{border-color:var(--accent)}
.money span{font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted)}
.money input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--display);font-stretch:85%;font-weight:800;font-size:34px;outline:none;padding:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.method{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 6px;font:600 14px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.method svg{width:22px;height:22px}
.method[aria-pressed="true"].m-cash{border-color:var(--cash);background:var(--cash-bg);color:var(--cash)}
.method[aria-pressed="true"].m-transfer{border-color:var(--transfer);background:var(--transfer-bg);color:var(--transfer)}
.method[aria-pressed="true"].m-due{border-color:var(--due);background:var(--due-bg);color:var(--due)}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:15px var(--body);background:var(--bg);color:var(--ink);width:100%}
.field input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px;font:600 15px var(--body);cursor:pointer}
.danger{background:none;border:1px solid var(--due);color:var(--due);border-radius:12px;padding:13px;font:600 15px var(--body);cursor:pointer}
.danger.armed{background:var(--due);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--due);font-size:13px;margin:-6px 0 0}
/* list */
.sec{display:grid;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h span{font-size:13px;color:var(--muted)}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row .time{font-size:13px;color:var(--muted)}
.row .who{min-width:0}
.row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right}
.row .amt b{font-family:var(--display);font-stretch:85%;font-size:17px;font-weight:700;display:block}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.p-cash{background:var(--cash-bg);color:var(--cash)} .p-transfer{background:var(--transfer-bg);color:var(--transfer)} .p-due{background:var(--due-bg);color:var(--due)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
/* fiados */
.due-total{background:var(--due-bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.due-total .big{color:var(--due);font-size:32px}
.due-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.due-row:first-child{border-top:0}
.due-row .who{min-width:0}
.due-row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-row .who small{color:var(--muted);font-size:12px}
.due-row .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.due-row .r b{font-family:var(--display);font-stretch:85%;font-size:17px}
.small{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font:600 13px var(--body);cursor:pointer}
.small.cash{border-color:var(--cash);color:var(--cash)} .small.transfer{border-color:var(--transfer);color:var(--transfer)}
.group-h{padding:8px 14px;background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.group-h:first-child{border-top:0}
/* week */
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 0}
.wrow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer}
.wrow .d{font-size:13px;text-transform:capitalize}
.wrow .d small{display:block;color:var(--muted);font-size:11px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--bg);min-width:0}
.bar i{display:block;height:100%}
.wrow .t{text-align:right;font-family:var(--display);font-stretch:85%;font-weight:700;font-size:15px;min-width:86px}
.wrow .t small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.wk-tot{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:24px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:92%;overflow:auto}
.sheet h3{margin:0;font-family:var(--display);font-stretch:85%;font-size:20px}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.method small{font-size:11px;font-weight:500;opacity:.8}
.acerto{border-top:1px solid var(--line);background:var(--bg);padding:12px 16px;display:grid;gap:6px}
.ac-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ac-row,.ac-res{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ac-row span{font-size:14px;min-width:0}
.ac-row b{font-family:var(--display);font-stretch:85%;font-size:16px;white-space:nowrap}
.ac-res{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.ac-res span{font-weight:700;font-size:15px}
.ac-res b{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:24px;white-space:nowrap}
.ac-foot{font-size:12px;color:var(--muted)}
.drv-table{border-top:1px solid var(--line)}
.drv-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.drv-row:first-child{border-top:0}
.drv-row .who{min-width:0}.drv-row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drv-row small{color:var(--muted);font-size:12px;display:block}
.drv-row .r{text-align:right}.drv-row .r b{font-family:var(--display);font-stretch:85%;font-size:17px}
.sum-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted-r{text-align:right;color:var(--muted);font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;color:var(--ink);font:600 14px var(--body);padding:9px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sheet .money input{font-size:28px}
/* keep everything inside the phone width */
html{overflow-x:hidden}
body{max-width:100%;overflow-x:clip}
main,header.top,.summary,.entry,.list,.sheet{max-width:100%}
main>*,.entry>*,.sec>*,.field>*{min-width:0}
.methods,.split,.wk-tot,.seg{grid-template-columns:repeat(3,minmax(0,1fr))}
.wk-tot{grid-template-columns:repeat(2,minmax(0,1fr))}
.method,.chip,.tile,.split div,.ac-row span,.ac-res span{min-width:0}
.method{text-align:center;overflow-wrap:anywhere;padding:10px 4px;font-size:13px}
.method small{font-size:10px;line-height:1.2}
.ac-row b,.ac-res b{white-space:nowrap;text-align:right;flex:none}
.ac-row span,.ac-res span{flex:1;min-width:0}
.ac-res b{font-size:22px}
.big{font-size:32px}
.count .big{font-size:26px}
.split>div{padding:10px 8px}
.split .v{font-size:15px}
.wrow{grid-template-columns:60px minmax(0,1fr) auto}
.wrow .t{min-width:0}
.row{grid-template-columns:40px minmax(0,1fr) auto}
.tile .v{font-size:20px;overflow-wrap:anywhere}
.brand{font-size:19px;min-width:0}
.sync{white-space:nowrap}
@media (max-width:360px){.big{font-size:28px}.split .v{font-size:13px}.money input{font-size:28px}}
.chip.other{border-style:dashed;border-color:var(--muted)}
.money input::placeholder{font-size:20px;font-weight:600;color:var(--muted)}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.who-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.rk-head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rk-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.rk-row:first-child{border-top:0}
.rk-row.me{background:var(--transfer-bg)}
.rk-pos{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:18px;color:var(--muted)}
.rk-pos.top{color:var(--accent)}
.rk-main{min-width:0;display:grid;gap:6px}
.rk-name{display:flex;align-items:center;gap:6px;min-width:0}
.rk-name b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-bar{display:block;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rk-n{text-align:right;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:22px;line-height:1}
.rk-n small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
nav.tabs button{padding-left:2px;padding-right:2px;font-size:13px}
.perm-warn{display:grid;gap:4px;background:var(--due-bg);border:1px solid var(--due);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.perm-warn b{color:var(--due)}
.sugs{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-top:6px;min-width:0}
.sug>*{min-width:0}
.sug span{flex:none}
/* iPhone zooms into any field under 16px: keep every field at 16px or more */
input,textarea,select,.field input,.pct-in input{font-size:16px!important}
.money input{font-size:30px!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input{touch-action:manipulation}
.entry,.summary,.list,.sec,.field,.sugs,.drv-row,.pend,.pend-h,.ac-pay,.pay-line{max-width:100%;min-width:0}
.pend-days,.pay-line,.ac-pay{overflow-wrap:anywhere}
.sug{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font:14px var(--body);cursor:pointer;text-align:left;min-width:0}
.sug b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sug span{font-size:12px;color:var(--muted);white-space:nowrap}
.ac-pay{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.pay-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.paid{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--cash-bg);color:var(--cash)}
.paid.warn{background:var(--due-bg);color:var(--due)}
.unpaid{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--due-bg);color:var(--due)}
.small.pay{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.small-link{font-size:12px;padding:0}

.ret-line{display:block;font-size:13px;color:var(--ink);margin:2px 0}
.tel-num{font-size:26px;font-weight:800;text-align:center;letter-spacing:.5px}
.tel-a{display:block;text-align:center;text-decoration:none;padding:15px!important;font-size:17px!important}
.entry-sheet .primary:disabled{opacity:1;background:color-mix(in srgb,var(--accent) 40%,var(--surface));color:color-mix(in srgb,var(--ink) 60%,transparent)}
.ub-row.ub3{grid-template-columns:minmax(0,1fr) auto auto}
.paste-btn{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-color:var(--accent);color:var(--ink)}
#maplink,#retlink{text-decoration:none;font-size:17px;padding:9px 12px}
.neto{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:0;margin:0 16px 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.neto>div{display:grid;gap:2px;padding:9px 10px;border-left:1px solid var(--line)}.neto>div:first-child{border-left:0}
.neto span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.neto b{font-size:15px;white-space:nowrap}
.neto-q{background:color-mix(in srgb,#2e9e5b 10%,transparent)}.neto-q b{font-size:17px}
.caja-open{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;border:1px dashed #d9a93a;border-radius:14px;background:color-mix(in srgb,#d9a93a 8%,transparent);color:var(--ink);font:15px var(--body);cursor:pointer}
.caja-open .caja-ic{font-size:24px}.caja-open small{display:block;color:var(--muted);font-size:12.5px}.caja-go{color:var(--muted);font-size:20px}
.caja{display:grid;gap:10px;border:1px solid #d9a93a;border-radius:16px;padding:14px;background:color-mix(in srgb,#d9a93a 7%,var(--surface))}
.caja.cerrada{border-color:var(--line);background:var(--surface)}
.caja-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.caja-h b{font-size:16px}.caja-h small{color:var(--muted);font-size:12.5px}
.caja-rows{display:grid;gap:5px;font-size:14.5px}.caja-rows>div{display:flex;justify-content:space-between;gap:10px}.caja-rows span{color:var(--muted)}
.caja-esp{border-top:1px solid var(--line);padding-top:7px;margin-top:2px}.caja-esp span{color:var(--ink)!important;font-weight:700}.caja-esp b{font-size:18px}
.caja-rows.mini .caja-esp{border:0;padding:0}
.caja-dif{border-radius:10px;padding:8px 10px;margin-top:4px;font-weight:700}.caja-dif span{color:inherit!important}
.caja-dif.ok{background:color-mix(in srgb,#2e9e5b 16%,transparent);color:#2e9e5b}.caja-dif.falta{background:var(--due-bg);color:var(--due)}.caja-dif.sobra{background:color-mix(in srgb,#4a8fe0 14%,transparent);color:#4a8fe0}
.caja-act{display:flex;gap:12px;align-items:center}
.caja-lock{color:var(--muted);font-size:13px}
.caja-fuera{display:grid;gap:5px;font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.caja-fuera>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.caja-fuera b{white-space:nowrap}.caja-fuera span{color:var(--muted)}
.cf-h{font-size:11.5px!important;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.caja-fuera small{color:var(--muted);font-size:12px}
.cf-tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}.cf-tot span{color:var(--ink)!important;font-weight:600}
.caja-reset{justify-self:start;color:var(--due)!important}.caja-reset.armed{font-weight:800}.caja-act .primary{flex:1}
.cta-mine{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--body);cursor:pointer}
.cta-mine small{display:block;color:var(--muted);font-size:12.5px}.cta-mine.due{border-color:var(--due)}.cta-mine.due b.num{color:var(--due)}.cta-mine.cash b.num{color:#2e9e5b}
.cf-open{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--body);cursor:pointer}
.cf-open small{display:block;color:var(--muted);font-size:12.5px}
.cf-row{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.cf-row:first-child{border-top:0}
.cf-row .who{display:grid;gap:2px;min-width:0}.cf-row b{font-size:16px}.cf-dir{font-size:13.5px;color:var(--ink)}.cf-row small{color:var(--muted);font-size:12.5px}
.cf-act{display:flex;gap:8px;flex-wrap:wrap}.cf-act .map-btn{text-decoration:none}
.cf-chips{display:grid;gap:4px}
.cf-row mark{background:#d9a93a;color:#1a1422;border-radius:3px;padding:0 1px}
.cf-count{font-size:12.5px;color:var(--muted);margin:0}.cf-chips small{color:var(--muted);font-size:12.5px}
.who-bar .wb-act{flex-wrap:wrap}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block}
.ic-checkc,.ic-dot{color:#2e9e5b}.ic-star{color:#d9a93a}.ic-flame{color:#e8743b}.ic-alert{color:var(--due)}.ic-gift{color:#d9a93a}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;white-space:nowrap}
.note{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

/* standalone app: base reset + login */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:40;background:var(--road);overflow:auto;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.lg-box{width:100%;max-width:420px;background:var(--surface);color:var(--ink);border-radius:18px;padding:24px 20px;display:grid;gap:14px;text-align:center}
.lg-logo{margin:0 auto;border-radius:16px}
.lg-box h1{margin:0;font-family:var(--display);font-stretch:80%;font-weight:800;font-size:28px;text-transform:uppercase}
.lg-sub{margin:-8px 0 0;color:var(--muted)}
.lg-form{display:grid;gap:12px;text-align:left}
.lg-form .linkbtn{justify-self:center}
.block{display:grid;gap:12px;justify-items:center;text-align:center;padding:40px 8px}
.block img{border-radius:16px}.block h2{margin:0;font-family:var(--display);font-stretch:85%}.block p{margin:0;color:var(--muted);max-width:340px}
.team-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge-in{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--due);color:#fff;font-size:11px;line-height:18px}
.wb-act{display:flex;gap:14px}
</style>

/* ---------- puntos y premios ----------
   1 punto por entrega · 5 por cerrar el día · 20 cada 7 días seguidos cerrando (los días sin entregas no cortan la racha).
   Ganados: ranking/<uid> {pd:{dia:entregas}, cier:[dias]} · Canjes: liq/<uid>/premios (solo dueño/socios) · Config: ranking/_puntos */
var PTS_INI="2026-10-22";
var PREM_DEF=[{p:600,n:"Recarga de celular ₲ 50.000"},{p:1500,n:"Tanque lleno de nafta"},{p:2000,n:"₲ 150.000"}];
var ptsCfg=null,canjes=new Map(),pEdit=null;
function premiosL(){const l=ptsCfg&&Array.isArray(ptsCfg.premios)&&ptsCfg.premios.length?ptsCfg.premios:PREM_DEF;return l.filter(x=>x&&x.p>0&&x.n).slice().sort((a,b)=>a.p-b.p)}
function ptsIni(){return (ptsCfg&&ptsCfg.inicio)||PTS_INI}
function sinPuntos(u){return roles.socios.includes(u)||(u===S.me&&isRealOwner)}
function livePts(u){const ini=ptsIni(),pd={},cier=[];if(!subs.has(u))return{pd,cier,mt:[],ok:false};const wf=addDays(today(),-WINDOW);
  for(const[,d]of S.items)if(d._u===u&&d.dia>=ini&&d.dia>=wf&&!isCamino(d)&&!d.diario)pd[d.dia]=(pd[d.dia]||0)+(d.cant||1);
  const p=S.people.get(u);if(p&&p.cierre&&p.cierre.dia>=ini)cier.push(p.cierre.dia);
  const mt=[];const t=today();if(metaDia>0&&t>=ini&&(pd[t]||0)>=metaDia)mt.push(t);return{pd,cier,mt,ok:true}}
function ptsDe(u){const r=rank.get(u)||{};const lv=livePts(u);const wf=addDays(today(),-WINDOW);const ini=ptsIni(),t=today();
  const pd={};for(const[k,v]of Object.entries(r.pd||{}))if(!lv.ok||k<wf)pd[k]=v;Object.assign(pd,lv.pd);
  const cier=new Set([...(r.cier||[]),...lv.cier]);const mts=new Set([...(r.mt||[]),...lv.mt].filter(d=>d>=ini));
  let ent=0,ci=0,bon=0,racha=0;const metas=mts.size;
  for(const d of Object.keys(pd).filter(d=>d>=ini&&pd[d]>0).sort()){ent+=pd[d];
    if(cier.has(d)){ci++;racha++;if(racha%7===0)bon++}else if(d!==t)racha=0}
  const ganados=ent+ci*5+bon*20+metas*10;const hist=[...canjes.values()].filter(c=>c._u===u).sort((a,b)=>(b.em||0)-(a.em||0));
  const usados=hist.reduce((a,c)=>a+(c.pts||0),0);
  return{ent,ci,bon,metas,racha,ganados,usados,pts:Math.max(0,ganados-usados),hist,cierHoy:cier.has(t)}}
function ptsCard(u){const P=ptsDe(u),pr=premiosL();if(!pr.length)return"";const yo=u===S.me;
  const next=pr.find(x=>x.p>P.pts),ready=pr.filter(x=>x.p<=P.pts);const prevP=0;
  const pct=next?Math.min(100,(P.pts-prevP)/(next.p-prevP)*100):100;
  return `<button type="button" class="pts-card" data-pts="${esc(u)}">
    <div class="pts-top"><span class="pts-n">⭐ <b class="num" data-v="${P.pts}">${P.pts.toLocaleString("es-PY")}</b> puntos${yo?"":" · "+esc(personName(u))}</span><span class="pts-right">${P.racha?`<span class="pts-racha">🔥 ${P.racha} ${P.racha===1?"día":"días"}</span>`:""}<span class="pts-more">Premios ›</span></span></div>
    <span class="pts-bar"><i style="width:${pct.toFixed(1)}%"></i></span>
    <small>${ready.length?`🎁 <b>${yo?"¡Ya ganaste":"Ya ganó"} ${esc(ready[ready.length-1].n)}!</b>${yo?" Pedile el premio a la empresa.":" Tocá para entregar el premio."}`
      :next?`${yo?"Te faltan":"Le faltan"} <b>${(next.p-P.pts).toLocaleString("es-PY")}</b> para <b>${esc(next.n)}</b>`:""}</small>
    </button>`}
function ptsAnim(pb){const nb=pb.querySelector(".pts-n b[data-v]");if(!nb){pb.dataset.v="";return}const nv=+nb.dataset.v,ov=pb.dataset.v===""||pb.dataset.v==null?NaN:+pb.dataset.v;pb.dataset.v=nv;
  if(isNaN(ov)||nv<=ov)return;const t0=performance.now(),dur=900;
  const step=now=>{const k=Math.min(1,(now-t0)/dur);nb.textContent=Math.round(ov+(nv-ov)*k).toLocaleString("es-PY");if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);
  const card=pb.querySelector(".pts-card");if(card){const pl=document.createElement("span");pl.className="pts-plus";pl.textContent="+"+(nv-ov);card.appendChild(pl);card.classList.add("pts-pop");setTimeout(()=>{pl.remove();card.classList.remove("pts-pop")},1600)}}
function ptsTeam(){const ids=activos().filter(u=>!sinPuntos(u)&&u!==S.me);if(!ids.length)return"";const pr=premiosL();
  const rows=ids.map(u=>({u,P:ptsDe(u)})).sort((a,b)=>b.P.pts-a.P.pts);const nReady=rows.filter(r=>pr.some(x=>x.p<=r.P.pts)).length;
  return `<details class="sec fold" id="pts-team"><summary class="sec-h"><h2>⭐ Puntos del equipo</h2><span class="fold-more">${nReady?`<b class="c-ok">🎁 ${nReady}</b> `:""}›</span></summary>
    <div class="list">${rows.map(({u,P})=>{const rd=pr.filter(x=>x.p<=P.pts);const nx=pr.find(x=>x.p>P.pts);
      return `<button type="button" class="pts-row" data-pts="${esc(u)}"><span class="who"><b>${esc(personName(u))}</b><small>${rd.length?"🎁 ganó "+esc(rd[rd.length-1].n):nx?"faltan "+(nx.p-P.pts).toLocaleString("es-PY")+" para "+esc(nx.n):""}${P.racha?" · 🔥 "+P.racha:""}</small></span><b class="num">⭐ ${P.pts.toLocaleString("es-PY")}</b></button>`}).join("")}</div>
    <button type="button" class="linkbtn small-link" data-pedit style="justify-self:start">✏️ Cambiar premios</button></details>`}

    .then(r=>r.ok?r.json():null).then(d=>{if(d&&d.current){CLIMA=d;climaAt=Date.now();try{localStorage.setItem(LSW,JSON.stringify({at:climaAt,d}))}catch(e){}render()}}).catch(()=>{}).finally(()=>{climaBusy=false})}

var cajas=new Map();

function cajaCalc(u,dia){const l=allItems().filter(([,d])=>d._u===u&&d.dia===dia&&!isCamino(d));
  let ef=0,prod=0,pago=0,diar=0,tr=0,ntr=0,emp=0,nemp=0;
  for(const[,d]of l){if(d.metodo==="efectivo"){ef+=d.valor||0;prod+=prodCobra(d)}else if(d.metodo==="pagado")pago+=d.valor||0;
    else if(d.metodo==="transferencia"){tr+=(d.valor||0)+prodCobra(d);ntr+=d.cant||1}
    else if(d.metodo==="anotado"){emp+=(d.valor||0)+prodCobra(d);nemp+=d.cant||1}
    else if(d.metodo==="fijo"&&d.diario){if(d.via==="transferencia")tr+=d.valor||0;else if(d.via==="empresa")emp+=d.valor||0;else diar+=d.valor||0}}
  const gas=[...S.gastos.values(),...(u===S.me?S.priv.values():[])].filter(g=>g._u===u&&g.dia===dia).reduce((a,g)=>a+(g.valor||0),0);
  const c=cajaOf(u,dia)||{};const ab=c.abre||0;return{ab,ef,prod,pago,diar,gas,tr,ntr,emp,nemp,esp:ab+ef+prod+pago+diar-gas,c}}

function weekStart(k){const d=fromKey(k);const wd=(d.getDay()+6)%7;return addDays(k,-wd)}
function countsIn(from,to){
  let rows;

  return rows.filter(r=>r.n>0).sort((a,b)=>b.n-a.n)}

    if(!NE.armed){NE.armed=true;t.classList.add("armed");t.textContent="Tocá de nuevo para eliminar";setTimeout(()=>{if(NE&&t.isConnected){NE.armed=false;t.classList.remove("armed");t.textContent="Eliminar"}},3000);return}
    const id=NE.id;clearTimeout(ntTimer);NE=null;try{await delNota(id);toast("Nota eliminada")}catch(err){toast("No se pudo eliminar")}openNotas();render();return}
  if(t.hasAttribute("data-pedit")){openPEdit();return}
  if(t.hasAttribute("data-peadd")){readPEdit();pEdit.push({p:0,n:""});drawPEdit();return}
  if(t.hasAttribute("data-pesave")){readPEdit();const l=pEdit.filter(x=>x.p>0&&x.n).map(x=>({p:x.p,n:x.n})).sort((a,b)=>a.p-b.p);if(!l.length){toast("Poné al menos un premio");return}
    ptsCfg={...(ptsCfg||{}),premios:l,inicio:ptsIni()};closeSheet();render(true);
    try{const w=await sendW(db.doc("ranking/_puntos").set(ptsCfg));toast(w==="wait"?"Guardado · se envía al volver la señal":"Premios guardados")}catch(err){toast("No se guardó.")}return}
  if(t.dataset.pcanje){const[u,i]=t.dataset.pcanje.split("|");const x=premiosL()[+i];if(!x)return;
    if(ptsDe(u).pts<x.p){toast("No le alcanzan los puntos");return}
    if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="¿Entregado? Tocá de nuevo";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="Entregar premio"}},3000);return}
    const id=uid(),c={pts:x.p,n:x.n,em:Date.now(),por:S.me};canjes.set(u+"|"+id,{...c,_u:u,_id:id});openPts(u);render(true);
    try{const w=await sendW(db.doc("liq/"+u+"/premios/"+id).set(c));toast("🎁 Premio entregado · −"+x.p.toLocaleString("es-PY")+" puntos")}catch(err){canjes.delete(u+"|"+id);openPts(u);toast("No se guardó.")}return}
  if(t.hasAttribute("data-msave")||t.hasAttribute("data-mdel")){const v=t.hasAttribute("data-mdel")?"":document.getElementById("m-txt").value.trim();closeSheet();
    try{if(v)await db.doc("ranking/_mensaje").set({texto:v,criadoEm:Date.now()});else await db.doc("ranking/_mensaje").delete();toast(v?"Aviso publicado para todos":"Aviso quitado")}catch(err){toast("No se guardó.")}return}
  if(t.dataset.spara){solPara=t.dataset.spara;layer.querySelectorAll("[data-spara]").forEach(c=>c.classList.toggle("on",c===t));return}
  if(t.dataset.stipo){solTipo=t.dataset.stipo;layer.querySelectorAll("[data-stipo]").forEach(c=>c.classList.toggle("on",c===t));return}
  if(t.hasAttribute("data-ssave")){const det=document.getElementById("s-det").value.trim();if(solTipo==="otro"&&!det){toast("Escribí qué necesitás");return}
    const para=S.owner?solPara:S.me;if(!para){toast("Elegí el delivery");return}
    const doc={tipo:solTipo,detalle:det,estado:"pendiente",criadoEm:Date.now()};if(S.owner)doc.porDueno=true;
    closeSheet();try{await db.collection("turnos/"+para+"/solicitudes").doc(uid()).set(doc);toast(S.owner?"Solicitud registrada para "+personName(para):"Solicitud enviada")}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="permission-denied"))noPerm();else toast("No se envió. Probá de nuevo.")}return}
  if(t.dataset.rsave){const r=document.getElementById("r-txt").value.trim();const k=t.dataset.rsave;closeSheet();try{await setSol(k,{respuesta:r});toast("Respuesta guardada")}catch(err){toast("No se guardó.")}return}
  if(t.dataset.baja){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="¿Confirmar baja?";return}
    try{await setBaja(t.dataset.baja,true);toast("Delivery dado de baja");openEquipo()}catch(err){toast("No se guardó.")}return}
  if(t.dataset.aprobar){try{await aprobar(t.dataset.aprobar);toast("Delivery aprobado");setTimeout(openEquipo,400)}catch(err){toast("No se guardó.")}return}
  if(t.dataset.socio){try{await setSocio(t.dataset.socio,t.dataset.on==="1");toast(t.dataset.on==="1"?"Ahora es socio":"Ya no es socio");openEquipo()}catch(err){toast("No se guardó.")}return}
  if(t.hasAttribute("data-logout")){logout();return}
  if(t.dataset.cuenta){openCuenta(t.dataset.cuenta);return}
  if(t.dataset.movnew){const[u,tp]=t.dataset.movnew.split("|");openMovNew(u,tp);return}
  if(t.dataset.movsave){const[u,tp]=t.dataset.movsave.split("|");const v=parseVal(document.getElementById("mv-val").value);if(!v){toast("Escribí el monto");return}
    const m={tipo:tp,monto:v,nota:document.getElementById("mv-nota").value.trim(),em:Date.now(),abierto:true,por:S.me};const id=uid();movs.set(u+"|"+id,{...m,_u:u,_id:id});openCuenta(u);
    try{await sendW(db.collection("liq/"+u+"/movs").doc(id).set(m));toast(tp==="abono"?"Pago registrado · "+gs(v):"Deuda registrada · "+gs(v))}catch(err){movs.delete(u+"|"+id);toast("No se guardó.");openCuenta(u)}return}
  if(t.dataset.movdel){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="¿quitar?";return}const[u,id]=t.dataset.movdel.split("|");movs.delete(u+"|"+id);openCuenta(u);
    try{await sendW(db.collection("liq/"+u+"/movs").doc(id).delete());toast("Quitado")}catch(err){toast("No se guardó.")}return}
  if(t.dataset.saldar){const u=t.dataset.saldar;if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="¿Seguro? Tocá de nuevo para dejar en cero";return}
    const c=cuentaDe(u);closeSheet();try{for(const x of c.dias)await setPago(u,x.dia,x.s);
      for(const m of c.ms){movs.delete(u+"|"+m._id);await sendW(db.collection("liq/"+u+"/movs").doc(m._id).set({abierto:false,cerradoEm:Date.now()},{merge:true}))}
      render(true);toast("Cuenta de "+personName(u)+" en cero ✅")}catch(err){toast("No se guardó.")}return}
  if(t.dataset.vpick){S.filter=t.dataset.vpick;closeSheet();render(true);window.scrollTo(0,0);return}
  if(t.hasAttribute("data-equipo")){openEquipo();return}
  if(t.hasAttribute("data-install")){doInstall();return}
  if(t.hasAttribute("data-locok")){try{localStorage.setItem(LSL,"si")}catch(e){}closeSheet();locTick(true);render(true);toast("📍 Ubicación activada durante el turno");return}
  if(t.hasAttribute("data-locno")){try{localStorage.setItem(LSL,"no")}catch(e){}closeSheet();render(true);return}
  if(t.dataset.tel){const u=t.dataset.tel;const cur=(S.people.get(u)||{}).tel||"";
    layer.innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-label="Teléfono">
      ${sheetHead("📞 Teléfono de "+esc(personName(u)))}
      <p class="hint" style="margin:0">Con el número, el botón 📲 WhatsApp abre directo la conversación con este delivery.</p>
      <div class="field"><label for="t-num">Número de WhatsApp</label><input id="t-num" type="tel" inputmode="tel" autocomplete="off" placeholder="Ej.: 0981 123 456" value="${esc(cur)}"></div>
      <button type="button" class="primary" data-telsave="${esc(u)}">Guardar</button>
      <button type="button" class="ghost" data-equipo2>Volver al equipo</button></div></div>`;
    setTimeout(()=>{const i=document.getElementById("t-num");if(i)i.focus()},60);return}
  if(t.dataset.telsave){const u=t.dataset.telsave;const v=document.getElementById("t-num").value.trim();const cur=S.people.get(u)||{};S.people.set(u,{...cur,tel:v});
    try{await sendW(db.doc("turnos/"+u).set({tel:v},{merge:true}));toast(v?"Teléfono guardado":"Teléfono quitado")}catch(err){toast("No se guardó.")}openEquipo();return}
  if(t.hasAttribute("data-equipo2")){openEquipo();return}
  if(t.dataset.horario){const u=t.dataset.horario;const h=(S.people.get(u)||{}).horario||{};
    let sem={},p=h.p||["",""];
    if(h.sem)sem={...h.sem};else if(h.t1){const ref=(h.refs||[])[0];for(const dd of ORD)sem[dd]=(h.libres||[]).includes(dd)?"libre":ref||"p";if(!ref)p=h.t1}
    HS={u,sem,p};drawHor();return}
  if(t.dataset.hall){for(const dd of ORD)if(HS.sem[dd]!=="libre")HS.sem[dd]=t.dataset.hall;drawHor();return}
  if(t.dataset.hd){const[dd,v]=t.dataset.hd.split("|");HS.sem[dd]=HS.sem[dd]===v?"":v;drawHor();return}
  if(t.dataset.horsave||t.dataset.hordel){const u=t.dataset.horsave||t.dataset.hordel;let h=null;
    if(t.dataset.horsave){const pa=document.getElementById("hp-a");if(pa)HS.p=["hp-a","hp-b","hp-c","hp-d"].map(id=>document.getElementById(id).value);
      if(HS.p&&((HS.p[2]&&!HS.p[3])||(!HS.p[2]&&HS.p[3]))){toast("El segundo horario necesita entrada y salida");return}
      const usaP=ORD.some(dd=>HS.sem[dd]==="p");if(usaP&&!(HS.p[0]&&HS.p[1])){toast("Poné entrada y salida del horario propio");return}
      if(!ORD.some(dd=>HS.sem[dd]&&HS.sem[dd]!=="libre")){toast("Elegí el turno de al menos un día");return}
      const sem={};for(const dd of ORD)if(HS.sem[dd])sem[dd]=HS.sem[dd];h={sem,p:usaP?HS.p:null,res:resolveSem(sem,HS.p)}}
    const cur=S.people.get(u)||{};S.people.set(u,{...cur,horario:h});HS=null;
    try{await sendW(db.doc("turnos/"+u).set({horario:h},{merge:true}));toast(h?"Horario guardado":"Horario quitado")}catch(err){toast("No se guardó.")}openEquipo();return}
  if(t.hasAttribute("data-tfedit")){layer.innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-label="Turnos fijos">
      ${sheetHead("🕒 Turnos fijos")}
      <p class="hint" style="margin:0">Definí los turnos una vez. Al cambiar un horario acá, se actualiza solo para todos los deliverys de ese turno. Dejá vacío el que no uses.</p>
      ${TF.map(x=>`<div class="lbl">${esc(x.n)}</div><div class="hor-grid"><label>Entrada<input type="time" id="tf-${x.id}-a" value="${esc(x.a||"")}"></label><label>Salida<input type="time" id="tf-${x.id}-b" value="${esc(x.b||"")}"></label></div>
      <div class="hor-grid"><label>2º horario (opcional)<input type="time" id="tf-${x.id}-a2" value="${esc(x.a2||"")}"></label><label>Salida<input type="time" id="tf-${x.id}-b2" value="${esc(x.b2||"")}"></label></div>`).join("")}
      <button type="button" class="ghost" data-tfadd>+ Agregar otro turno</button>
      <button type="button" class="primary" data-tfsave>Guardar turnos</button>
      <button type="button" class="ghost" data-equipo2>Volver al equipo</button></div></div>`;return}
  if(t.hasAttribute("data-tfadd")){const nl=TF.map(x=>({...x,a:document.getElementById("tf-"+x.id+"-a").value,b:document.getElementById("tf-"+x.id+"-b").value,a2:document.getElementById("tf-"+x.id+"-a2").value,b2:document.getElementById("tf-"+x.id+"-b2").value}));
    let k=TF.length+1;while(TF.some(x=>x.id==="t"+k))k++;TF=[...nl,{id:"t"+k,n:"🕒 "+k+"º Turno",a:"",b:""}];layer.querySelector("[data-tfedit]")||0;
    const fake=document.createElement("button");fake.setAttribute("data-tfedit","");layer.appendChild(fake);fake.click();return}
  if(t.hasAttribute("data-tfsave")){const nl=TF.map(x=>({...x,a:document.getElementById("tf-"+x.id+"-a").value,b:document.getElementById("tf-"+x.id+"-b").value,a2:document.getElementById("tf-"+x.id+"-a2").value,b2:document.getElementById("tf-"+x.id+"-b2").value}));
    if(nl.some(x=>(x.a&&!x.b)||(!x.a&&x.b)||(x.a2&&!x.b2)||(!x.a2&&x.b2))){toast("Cada turno necesita entrada y salida");return}
    TF=nl;let n=0;
    try{const ps=[sendW(db.doc("config/turnos").set({list:TF}))];
      for(const[u,pp]of S.people){const h=pp&&pp.horario;if(!h||!h.sem)continue;const nh={...h,res:resolveSem(h.sem,h.p)};S.people.set(u,{...pp,horario:nh});n++;ps.push(sendW(db.doc("turnos/"+u).set({horario:nh},{merge:true})))}
      await Promise.all(ps);toast("Turnos guardados"+(n?" · actualizados "+plural(n,"delivery"):""))}catch(err){toast("No se guardó.")}openEquipo();return}
  if(t.hasAttribute("data-metasave")||t.hasAttribute("data-metadel")){const v=t.hasAttribute("data-metadel")?0:Math.min(200,parseVal(document.getElementById("meta-n").value));closeSheet();
    metaDia=v;render(true);
    try{const w=await sendW(v?db.doc("ranking/_meta").set({n:v,criadoEm:Date.now()}):db.doc("ranking/_meta").delete());toast(v?"Meta: "+plural(v,"entrega")+" por día":"Meta quitada")}catch(err){toast("No se guardó.")}return}
  if(t.hasAttribute("data-cierreok")){const n=stats(listDay(today()).filter(([,d])=>d._u===S.me)).n;const c={dia:today(),em:Date.now(),n};closeSheet();
    const cur=S.people.get(S.me)||{};S.people.set(S.me,{...cur,cierre:c});render(true);scheduleRank(S.me);
    try{const w=await sendW(db.doc("turnos/"+S.me).set({cierre:c},{merge:true}));toast(w==="wait"?"Cierre guardado · se envía al volver la señal":"Día cerrado · ¡buen trabajo!")}catch(err){toast("No se guardó.")}return}
  if(t.dataset.reactivar){try{await setBaja(t.dataset.reactivar,false);toast("Delivery reactivado");openEquipo()}catch(err){toast("No se guardó.")}return}
  if(t.dataset.dvia){layer.querySelectorAll("[data-dvia]").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t.dataset.dsave){const v=parseVal(document.getElementById("d-val").value);if(!v){toast("Escribí el monto del diario");return}
    const via=(layer.querySelector('[data-dvia][aria-pressed="true"]')||{dataset:{dvia:"efectivo"}}).dataset.dvia;
    const when=S.dia===today()?new Date():new Date(fromKey(S.dia).setHours(20,0,0,0));
    const d={valor:v,metodo:"fijo",diario:true,via,cliente:t.dataset.dsave,obs:via==="empresa"?"Diario · cobró la empresa":"Diario",dia:S.dia,criadoEm:when.getTime()};
    const wt=writeTarget(),eid=uid();
    if(via==="empresa"&&db){const m={tipo:"abono",monto:v,nota:"Diario "+t.dataset.dsave+" (cobró la empresa)",em:Date.now(),abierto:true,por:S.me,ref:eid};const mid=uid();movs.set(wt+"|"+mid,{...m,_u:wt,_id:mid});sendW(db.collection("liq/"+wt+"/movs").doc(mid).set(m)).catch(()=>toast("No se guardó el descuento en la cuenta"))}
    closeSheet();try{const w=await sendW(addItem(d,wt,eid));if(w==="wait"){toast("Guardado en el celular · se envía al volver la señal")}else toast(via==="empresa"?"Diario "+gs(v)+" · descontado de la cuenta de "+personName(wt):"Diario guardado: "+gs(v))}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="permission-denied"))noPerm();else toast("No se guardó.")}return}
  if(t.dataset.camprod){const k=t.dataset.camprod;const d=S.items.get(k);if(!d)return;const v=d.pagoTipo==="prod"?null:"prod";d.pagoTipo=v;openCamino(k);render();
    try{await sendW(patchItem(k,{pagoTipo:v}));toast(v?"Cobrar solo el delivery: "+gs(d.valor):"Vuelve a cobrar producto + delivery")}catch(err){toast("No se guardó.")}return}
  if(t.dataset.copyc){const d=S.items.get(t.dataset.copyc);if(d)copy(cuentaTxt(d.producto||0,d.valor,d.pagoTipo));return}
  if(t.dataset.entregado){const k=t.dataset.entregado,how=t.dataset.how,d=S.items.get(k);if(!d)return;
    if(how==="anotado"&&!(d.cliente||"").trim()){toast("Para anotar, el pedido necesita nombre de cliente");return}
    const r=S.mode==="db"&&!S.owner&&pagoOf(S.me,today())?"Hoy ya fue liquidado. Pedile al dueño que lo registre.":"";if(r){lockedMsg(r);return}
    if(t.dataset.pendc&&!(d.cliente||"").trim()){toast("Para cobrar después, el pedido necesita nombre de cliente");return}
    closeSheet();try{if(t.dataset.pendc)addPend(d._u,d._id,{...d,dia:today()}).catch(()=>{});await patchItem(k,how==="fijo"?{estado:"ok",metodo:how,valor:0,dia:today(),criadoEm:Date.now()}:{estado:"ok",metodo:how,dia:today(),criadoEm:Date.now()});toast(t.dataset.pendc?"Entregado · ⏳ transferencia por cobrar":"Entrega finalizada · "+M[how].n)}catch(err){toast("No se guardó.")}return}
  if(t.dataset.cdel){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Tocá de nuevo para quitarlo";return}
    const k=t.dataset.cdel;closeSheet();try{await delItem(k);toast("Quitado de la lista")}catch(err){toast("No se eliminó.")}return}
  if(t.hasAttribute("data-nsave")){const n=document.getElementById("n-val").value.trim();if(!n){toast("Escribí tu nombre");return}closeSheet();try{await saveName(n);toast("Nombre guardado")}catch(err){noPerm()}return}
  if(t.hasAttribute("data-psave")){const g=parseVal(document.getElementById("p-gen").value);if(!g||g>=100){toast("Usá un número entre 1 y 99");return}
    const por={};let bad=false;layer.querySelectorAll("[data-pu]").forEach(i=>{const v=parseVal(i.value);if(i.value&&(!v||v>=100))bad=true;if(v&&v<100&&v!==g)por[i.dataset.pu]=v});
    if(bad){toast("Usá números entre 1 y 99");return}
    closeSheet();try{await saveCfg({pct:g,por});toast("Comisiones guardadas")}catch(err){toast("No se guardó.")}return}
  if(!edit)return;
  if(t.dataset.emetodo){edit.metodo=t.dataset.emetodo;edit.armed=false;drawSheet()}
  else if(t.hasAttribute("data-esave")){if(!edit.valor){toast("Escribí el monto");return}
    const p={valor:edit.valor,cant:edit.metodo==="fijo"?(edit.cant||1):1,producto:edit.producto||0,metodo:edit.metodo,cliente:edit.cliente.trim(),obs:edit.obs.trim()};
    const k=edit.key;closeSheet();
    if(needsApproval()){try{await pedirCambio(k,"editar",p);toast("Pedido de cambio enviado al dueño")}catch(err){toast("No se envió.")}return}
    try{await patchItem(k,p);toast("Entrega actualizada")}catch(err){toast("No se guardó.")}}
  else if(t.hasAttribute("data-edel")){if(!edit.armed){edit.armed=true;drawSheet();return}
    const k=edit.key;closeSheet();
    if(needsApproval()){try{await pedirCambio(k,"borrar",null);toast("Pedido para borrar enviado al dueño")}catch(err){toast("No se envió.")}return}
    try{await delItem(k);toast("Entrega eliminada")}catch(err){toast("No se eliminó.")}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer.innerHTML&&!document.getElementById("n-val"))closeSheet()});
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
